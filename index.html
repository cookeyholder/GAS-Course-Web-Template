/* ../gasRuntime.js */
/**
 * @file gasRuntime.js
 * @description GAS / Node.js 雙環境共用的相依解析與安全試算表取得（task 4.3）
 *
 * 統一提供三項能力：
 * - resolveDependency_：module.exports → globalThis → fallback（未提供 fallback 時 fail-fast）
 * - getActiveSpreadsheetSafe_：options.spreadsheet → SpreadsheetApp → null
 * - injectGlobals_：僅注入白名單匯出，避免 Object.assign 全域污染
 */
(function (root, factory) {
  "use strict";

  const api = factory();

  if (typeof module !== "undefined" && module.exports) module.exports = api;
  if (root) root.gasRuntime = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  /** 系統設定與授權工作表名稱（前後端共用單一來源） */
  const SHEET_SYSTEM_CONFIG = "系統設定與授權";

  /** 1NF 正規化課程代碼工作表名稱（前後端共用單一來源） */
  const SHEET_COURSE_INDEX = "正規化課程代碼";

  /** 舊版工作表名稱，僅供初始化時一次性更名遷移使用 */
  const LEGACY_SHEET_COURSE_INDEX = "正規化課程索引";

  /** 系統使用說明工作表名稱（前後端共用單一來源） */
  const SHEET_SYSTEM_INSTRUCTIONS = "系統使用說明";

  /** 操作日誌工作表名稱（前後端共用單一來源） */
  const SHEET_ACTIVITY_LOG = "操作日誌";

  /** Web API 版本號退回值：無建置注入（如 Node 測試）時使用，對外維持 1.1.0 */
  const FALLBACK_WEB_API_VERSION = "1.1.0";

  /**
   * 解析 Web API 版本號（task 5.1）：優先使用 build-webapp.js 由 package.json
   * 產生並隨 push 上傳的 version.generated.js 所掛載的全域值，退回固定值。
   *
   * 採 getter 延遲讀取，以相容 GAS 檔案載入順序（version.generated.js 在 gasRuntime.js 之後）。
   *
   * @returns {string} Web API 版本號
   */
  function resolveWebApiVersion_() {
    const injected = typeof globalThis !== "undefined" ? globalThis.__PACKAGE_VERSION__ : undefined;
    return typeof injected === "string" && injected.trim() !== "" ? injected.trim() : FALLBACK_WEB_API_VERSION;
  }

  /**
   * 操作日誌 12 欄 schema（task 5.2）：英文欄位順序與中文表頭一一對應。
   * 此為唯一來源；寫入端（databaseInitializer／activityLogger）與查詢端
   * （activityLogQuery）皆由此衍生，避免重複陣列與索引硬編碼。
   */
  const ACTIVITY_LOG_FIELDS = [
    "timestamp",
    "requestId",
    "category",
    "action",
    "result",
    "email",
    "name",
    "role",
    "summary",
    "detail",
    "durationMs",
    "errorCode"
  ];

  /** 操作日誌 12 欄中文表頭，順序須與 ACTIVITY_LOG_FIELDS 一致 */
  const ACTIVITY_LOG_HEADERS = [
    "時間戳記",
    "請求識別碼",
    "事件類別",
    "動作名稱",
    "結果",
    "操作者 email",
    "操作者姓名",
    "角色",
    "摘要",
    "詳情 JSON",
    "耗時（毫秒）",
    "錯誤代碼"
  ];

  /** 欄位名稱至零基索引的對應（由 ACTIVITY_LOG_FIELDS 衍生，消除 cells[0..11] 硬編碼） */
  const ACTIVITY_LOG_FIELD_INDEX = ACTIVITY_LOG_FIELDS.reduce(function (index, field, position) {
    index[field] = position;
    return index;
  }, {});

  /** 詳情序列化失敗或降級時使用的最小合法 JSON */
  const MINIMAL_ACTIVITY_DETAIL_JSON = '{"版本":1,"動作":"","指標":{},"截斷":true}';

  /** 詳情序列化後的字元上限 */
  const ACTIVITY_DETAIL_MAX_LENGTH = 500;

  /** 授權角色代碼（task 5.3：所有角色判定共用單一來源） */
  const ROLE_CODES = {
    ADMIN: "admin",
    STAFF: "staff",
    VIEWER: "viewer"
  };

  /** 授權角色定義（所有後端角色顯示名稱共用單一來源） */
  const ROLE_DEFINITIONS = {
    [ROLE_CODES.ADMIN]: "系統管理員",
    [ROLE_CODES.STAFF]: "業務人員",
    [ROLE_CODES.VIEWER]: "檢視人員"
  };

  /**
   * 判斷物件是否自有指定屬性。
   *
   * @param {*} value - 待檢查物件
   * @param {string} key - 屬性名稱
   * @returns {boolean} 是否為自有屬性
   */
  function hasOwn(value, key) {
    return value !== null && value !== undefined && Object.prototype.hasOwnProperty.call(value, key);
  }

  /**
   * 唯一的相依解析入口，順序為：overrides（呼叫端 module.exports）→ globalThis → 模組 module.exports → fallback。
   *
   * overrides 由呼叫端傳入自身的 module.exports（例如 webApi），保留以
   * `api[key] = stub` 注入測試替身的接縫；值為 null／undefined 視為未提供。
   * globalThis 涵蓋 GAS 全域命名空間與 Node 白名單注入，兩者皆優先於
   * 明確指定 modulePath 時的模組匯出（向後相容既有注入行為）。
   * 模組載入失敗不得被空 catch 靜默吞沒：若無其他來源可解析，
   * 即 fail-fast 並拋出含匯出名稱與模組路徑的錯誤。
   *
   * requireModule 供「解析整個模組本體」使用：活動日誌等模組的全域與
   * module.exports 即為 API 本體，並無與模組同名的具名匯出；此模式下
   * require 成功即回傳整包模組，重現既有 resolveActivityLogModule_ 語意。
   *
   * @param {string} name - 相依匯出名稱
   * @param {string} [modulePath] - Node.js require 路徑
   * @param {*} [fallback] - 選用備援值
   * @param {Object} [overrides] - 呼叫端 module.exports（測試注入接縫）
   * @param {boolean} [requireModule] - 是否解析整包模組本體
   * @returns {*} 解析後的相依
   */
  function resolveDependency_(name, modulePath, fallback, overrides, requireModule) {
    // 1. 呼叫端注入的 module.exports 最優先（測試接縫）。
    if (overrides && hasOwn(overrides, name) && overrides[name] !== null && overrides[name] !== undefined) {
      return overrides[name];
    }

    // 2. globalThis（GAS 全域命名空間或 Node 白名單注入）。
    if (typeof globalThis !== "undefined" && hasOwn(globalThis, name)) return globalThis[name];

    // 3. 明確指定模組路徑時，取用其 module.exports；載入失敗僅記錄，
    //    讓 fallback 仍有機會解析，最後才 fail-fast。
    let loadError = null;
    if (typeof require === "function" && modulePath) {
      let moduleExports;
      try {
        moduleExports = require(modulePath);
      } catch (error) {
        loadError = error;
      }
      if (moduleExports) {
        if (requireModule) return moduleExports;
        if (hasOwn(moduleExports, name)) return moduleExports[name];
      }
    }

    // 4. 明確提供的備援值。
    if (arguments.length >= 3) return fallback;

    // 5. 全數失敗：fail-fast，載入失敗時一併帶出模組名稱。
    if (loadError) {
      throw new Error("找不到相依匯出：" + name + "（無法載入 " + modulePath + "：" + loadError.message + "）");
    }
    throw new Error("找不到相依匯出：" + name);
  }

  /**
   * 正規化允許登入網域（task 5.5）：去除前綴 @、前後空白並轉小寫。
   * 前後端共用單一來源，避免各模組重複規則產生語意漂移。純函式，無副作用。
   *
   * @param {*} configuredDomain - 設定的網域值（支援字串或非字串容錯）
   * @returns {string} 正規化後的純小寫網域名稱（無前綴 @）
   */
  function normalizeAllowedDomain(configuredDomain) {
    return String(configuredDomain || "")
      .trim()
      .replace(/^@/, "")
      .toLowerCase();
  }

  /**
   * 安全取得試算表：明確傳入 > SpreadsheetApp > null。
   *
   * @param {Object} [options] - 選項
   * @param {*} [options.spreadsheet] - 明確指定的試算表
   * @returns {*} 試算表實例或 null
   */
  function getActiveSpreadsheetSafe_(options) {
    const opts = options || {};
    if (opts.spreadsheet) return opts.spreadsheet;
    if (
      typeof SpreadsheetApp !== "undefined" &&
      SpreadsheetApp &&
      typeof SpreadsheetApp.getActiveSpreadsheet === "function"
    ) {
      return SpreadsheetApp.getActiveSpreadsheet();
    }
    return null;
  }

  /**
   * 白名單注入全域（僅 Node.js 測試環境需要）。
   * 任一要求的匯出不存在即 fail-fast，避免拼字錯誤被靜默忽略。
   * 僅在全域不存在時寫入，避免覆寫測試預先設定的同名 sentinel。
   *
   * @param {string} modulePath - Node.js require 路徑
   * @param {Array<string>} whitelist - 允許注入的匯出名稱
   * @returns {Object} 實際注入的名稱與值
   */
  function injectGlobals_(modulePath, whitelist) {
    if (typeof require !== "function") return {};
    const moduleExports = require(modulePath);
    const names = Array.isArray(whitelist) ? whitelist : [];
    const injected = {};
    names.forEach(function (name) {
      if (!hasOwn(moduleExports, name)) {
        throw new Error("相依模組 " + modulePath + " 未匯出 " + name);
      }
      if (typeof globalThis !== "undefined" && !hasOwn(globalThis, name)) {
        globalThis[name] = moduleExports[name];
        injected[name] = moduleExports[name];
      }
    });
    return injected;
  }

  return {
    SHEET_SYSTEM_CONFIG: SHEET_SYSTEM_CONFIG,
    SHEET_COURSE_INDEX: SHEET_COURSE_INDEX,
    LEGACY_SHEET_COURSE_INDEX: LEGACY_SHEET_COURSE_INDEX,
    SHEET_SYSTEM_INSTRUCTIONS: SHEET_SYSTEM_INSTRUCTIONS,
    SHEET_ACTIVITY_LOG: SHEET_ACTIVITY_LOG,
    get WEB_API_VERSION() {
      return resolveWebApiVersion_();
    },
    ACTIVITY_LOG_FIELDS: ACTIVITY_LOG_FIELDS,
    ACTIVITY_LOG_HEADERS: ACTIVITY_LOG_HEADERS,
    ACTIVITY_LOG_FIELD_INDEX: ACTIVITY_LOG_FIELD_INDEX,
    MINIMAL_ACTIVITY_DETAIL_JSON: MINIMAL_ACTIVITY_DETAIL_JSON,
    ACTIVITY_DETAIL_MAX_LENGTH: ACTIVITY_DETAIL_MAX_LENGTH,
    ROLE_CODES: ROLE_CODES,
    ROLE_DEFINITIONS: ROLE_DEFINITIONS,
    hasOwn: hasOwn,
    normalizeAllowedDomain: normalizeAllowedDomain,
    resolveDependency_: resolveDependency_,
    getActiveSpreadsheetSafe_: getActiveSpreadsheetSafe_,
    injectGlobals_: injectGlobals_
  };
});
  </script>

      const requestId = ++requestSeq;
      setState(Object.assign({}, before, { loading: true, page: targetPage }));

      const pending = callApi(apiAction, query)
        .then(function (result) {
          return handleResult(result, requestId, targetPage);
        })
        .catch(function (error) {
          return handleError(error, requestId);

    /**
     * 表單提交或搜尋觸發常式：讀取篩選欄位後重設回第 1 頁查詢。
     *
     * @param {Event} [event] - 表單提交事件

      if (event && event.preventDefault) event.preventDefault();

     * 產生共用的上一頁／下一頁簡易分頁列 HTML。
     *
     * @param {Object} state - 目前狀態物件
     * @param {boolean} [loading] - 是否正在載入
     * @returns {string} 分頁工具列 HTML
     */

      const normalize =
        pagination.normalize ||
        function (value) {

      const currentPage = info.currentPage || 1;
      const number =
        pagination.number ||
        function (value) {

        };
      const actionAttribute = pagination.actionAttribute || "data-action";
      return (
        '<div class="pagination-bar">' +
        '  <span class="pagination-info">共 ' +
        number(info.total) +
        " 筆紀錄 · 第 " +
        currentPage +
        " / " +
        totalPages +
        " 頁</span>" +
        '  <div class="pagination-buttons">' +
        '    <button type="button" class="btn secondary compact" ' +
        actionAttribute +
        '="page" data-page="' +
        (currentPage - 1) +
        '"' +
        (currentPage <= 1 || loading ? " disabled" : "") +
        ">上一頁</button>" +
        '    <button type="button" class="btn secondary compact" ' +
        actionAttribute +
        '="page" data-page="' +
        (currentPage + 1) +
        '"' +
        (currentPage >= totalPages || loading ? " disabled" : "") +
        ">下一頁</button>" +
        "  </div>" +
        "</div>"
      );
    }

    return {
      fetchList: fetchList,
      handleSearch: handleSearch,
      resetSearch: resetSearch,
      renderPagination: renderPagination,
      isCurrentRequest: isCurrentRequest
    };
  }

  return {
    createListController: createListController
  };
});

   * @param {boolean} disabled - 是否停用
   * @param {string} ariaLabel - 無障礙輔助標籤
   * @param {Object} opt - 分頁組態選項
   * @returns {string} 按鈕 HTML
   */
  function renderNavBtn_(label, targetPage, disabled, ariaLabel, opt) {
    const pageNum = Number.isFinite(Number(targetPage)) ? Math.floor(Number(targetPage)) : 1;
    let actionAttrs = "";
    if (opt.actionAttribute) {
      actionAttrs = " " + escapeHtml(opt.actionAttribute) + '="page" data-page="' + pageNum + '"';
    } else if (opt.onPageChange) {
      const handler = String(opt.onPageChange).replace(/\{page\}/g, String(pageNum));
      actionAttrs = ' onclick="' + escapeHtml(handler) + '"';
    }
    const disAttr = disabled ? " disabled" : "";
    return (
      '<button type="button" class="btn secondary sm" style="font-size:13px; padding:4px 8px; line-height:1.2;"' +
      ' aria-label="' +
      escapeHtml(ariaLabel) +
      '"' +
      actionAttrs +
      disAttr +
      ">" +
      label +
      "</button>"
    );
  }

  /**
   * 內部純輔助函式：產生導覽按鈕組 HTML（圈複雜度 <= 4）。
   *
   * @param {Object} opt - 分頁組態選項
   * @param {string} prefix - ID 前綴字串
   * @param {Object} win - 分頁視窗計算成果
   * @param {boolean} hasData - 是否有資料
   * @param {boolean} isSinglePage - 是否僅有單頁
   * @returns {string} 導覽按鈕群組 HTML
   */
  function renderPaginationNavButtons_(opt, prefix, win, hasData, isSinglePage) {
    if (!opt.onPageChange && !opt.actionAttribute) return "";
    const jumpSelectHtml = renderPageJumpSelect_(opt, prefix, win, hasData, isSinglePage);
    const isDisabledPrev = !win.hasPrev || opt.disabled === true;
    const isDisabledNext = !win.hasNext || opt.disabled === true;

    const firstBtn = renderNavBtn_("第一頁", 1, isDisabledPrev, "前往第一頁，共 " + win.totalPages + " 頁", opt);
    const prevBtn = renderNavBtn_(
      "上一頁",
      win.currentPage - 1,
      isDisabledPrev,
      "上一頁，目前第 " + win.currentPage + " 頁，共 " + win.totalPages + " 頁",
      opt
    );
    const nextBtn = renderNavBtn_(
      "下一頁",
      win.currentPage + 1,
      isDisabledNext,
      "下一頁，目前第 " + win.currentPage + " 頁，共 " + win.totalPages + " 頁",
      opt
    );
    const lastBtn = renderNavBtn_(
      "最末頁",
      win.totalPages,
      isDisabledNext,
      "前往最末頁，共 " + win.totalPages + " 頁",
      opt
    );

    return (
      '<div style="display:inline-flex; align-items:center; gap:4px;">' +
      firstBtn +
      prevBtn +
      jumpSelectHtml +
      nextBtn +
      lastBtn +
      "</div>"
    );
  }

  /**
   * 內部純輔助函式：產生統計字串 HTML（圈複雜度 <= 2）。
   *
   * @param {Object} win - 分頁視窗計算成果
   * @param {string} [itemLabel] - 單位名稱（預設為「筆紀錄」）
   * @param {Object} opt - 分頁組態選項
   * @returns {string} 統計摘要 HTML
   */
  function renderPaginationSummary_(win, itemLabel, opt) {
    if (typeof opt.summaryFormatter === "function") {
      return opt.summaryFormatter(win, itemLabel);
    }
    const label = itemLabel ? String(itemLabel).trim() : "筆紀錄";
    return (
      '<span class="pagination-info" style="font-size:13.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap;" aria-live="polite">' +
      "共 " +
      number(win.totalItems) +
      " " +
      escapeHtml(label) +
      " · 第 " +
      win.currentPage +
      " / " +
      win.totalPages +
      " 頁" +
      '<span class="sr-only" aria-current="page">，目前第 ' +
      win.currentPage +
      " 頁</span>" +
      "</span>"
    );
  }

  /**
   * 通用純函式雙向分頁工具列元件。
   *
   * @param {Object} [options] - 分頁工具列選項
   * @returns {string} 完整分頁導覽列 HTML
   */
  function renderPaginationBar(options) {
    const opt = options || {};
    const win = calculatePaginationWindow(opt.total, opt.page, opt.pageSize || 20);
    if (Number.isFinite(parseInt(opt.totalPages, 10)) && parseInt(opt.totalPages, 10) > 0) {
      win.totalPages = parseInt(opt.totalPages, 10);
    }
    if (Number.isFinite(parseInt(opt.page, 10)) && parseInt(opt.page, 10) > 0) {
      win.currentPage = Math.max(1, Math.min(win.totalPages, parseInt(opt.page, 10)));
    }
    win.hasNext = win.currentPage < win.totalPages;
    win.hasPrev = win.currentPage > 1;
    const position = opt.position === "top" ? "top" : "bottom";
    const prefix = (opt.idPrefix ? String(opt.idPrefix).trim() : "pagination") + "-" + position;
    const baseNavLabel = opt.navAriaLabel ? String(opt.navAriaLabel).trim() : "分頁導覽";
    const navAriaLabel = baseNavLabel + (position === "top" ? "（上方）" : "（下方）");
    const hasData = win.totalItems > 0;
    const isSinglePage = win.totalPages <= 1;

    const summaryHtml = renderPaginationSummary_(win, opt.itemLabel, opt);
    const pageSizeSelectHtml = renderPageSizeSelect_(opt, prefix, win, hasData);
    const navButtonsHtml = renderPaginationNavButtons_(opt, prefix, win, hasData, isSinglePage);

    const barClass = position === "top" ? "pagination-bar pagination-bar-top" : "pagination-bar pagination-bar-bottom";

    return (
      '<div class="' +
      barClass +
      '" role="navigation" aria-label="' +
      escapeHtml(navAriaLabel) +
      '" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin: 8px 0; font-size:13.5px;">' +
      '  <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">' +
      summaryHtml +
      pageSizeSelectHtml +
      "  </div>" +
      navButtonsHtml +
      "</div>"
    );
  }

  /**
   * 正規化表格欄位對齊方式（白名單防禦純函式）。
   *
   * @param {string} [align] - 對齊設定字串
   * @returns {string} 正規化後之合法對齊方式（left, center, right, justify 或空字串）
   */
  function normalizeTableAlign(align) {
    if (!align) return "";
    const s = String(align).toLowerCase().trim();
    return s === "left" || s === "center" || s === "right" || s === "justify" ? s : "";
  }

  /**
   * 渲染表格表頭 HTML（純函式）。
   *
   * @param {Array<Object>} columns - 欄位定義清單
   * @returns {string} 包含 thead 與 th 之 HTML 字串
   */
  function renderTableHead(columns) {
    if (!Array.isArray(columns) || columns.length === 0) return "";
    let ths = "";
    for (let i = 0; i < columns.length; i++) {
      const col = columns[i] || {};
      const title = escapeHtml(col.title || col.name || col.label || "");
      const validAlign = normalizeTableAlign(col.align);
      const align = validAlign ? ' style="text-align:' + validAlign + ';"' : "";
      const width = col.width ? ' width="' + escapeHtml(col.width) + '"' : "";
      ths += '<th scope="col"' + align + width + ">" + title + "</th>";
    }
    return "<thead><tr>" + ths + "</tr></thead>";
  }

  /**
   * 渲染表格狀態提示列 HTML（保護 <td> 單元格語意，純函式）。
   *
   * @param {Object} [options] - 狀態列設定
   * @returns {string} tr 與 td 提示列 HTML
   */
  function renderTableStatusRow(options) {
    const opt = options || {};
    const span = Number.isFinite(opt.colspan) && opt.colspan > 0 ? Math.floor(opt.colspan) : 1;
    if (opt.loading) {
      const loadingText = escapeHtml(opt.loadingText || "載入中...");
      return (
        '<tr><td colspan="' +
        span +
        '" style="text-align:center; padding:28px; color:var(--ink-2);">' +
        '<div role="status" aria-live="polite">' +
        '<span class="spinner" style="display:inline-block; margin-right:8px;" aria-hidden="true">⏳</span>' +
        loadingText +
        "</div></td></tr>"
      );
    }
    const emptyContent = opt.emptyHtml ? String(opt.emptyHtml) : escapeHtml(opt.emptyText || "查無資料");
    return (
      '<tr><td colspan="' +
      span +
      '" style="text-align:center; padding:28px; color:var(--ink-2);">' +
      '<div role="status" aria-live="polite">' +
      emptyContent +
      "</div></td></tr>"
    );
  }

  /**
   * 內部純輔助函式：產生宣告式欄位之資料列 HTML（圈複雜度 <= 4）。
   *
   * @param {Array<Object>} items - 資料項目清單
   * @param {Array<Object>} columns - 欄位定義清單
   * @returns {string} 各資料列 tr 之 HTML 字串
   */
  function renderDeclarativeRows_(items, columns) {
    let rowsHtml = "";
    for (let r = 0; r < items.length; r++) {
      const row = items[r] || {};
      let tds = "";
      for (let c = 0; c < columns.length; c++) {
        const col = columns[c] || {};
        const key = col.key || col.field || "";
        const rawVal = key ? row[key] : "";
        const content =
          typeof col.formatter === "function" ? col.formatter(rawVal, row, r) : escapeHtml(String(rawVal ?? ""));
        const validAlign = normalizeTableAlign(col.align);
        const align = validAlign ? ' style="text-align:' + validAlign + ';"' : "";
        tds += "<td" + align + ">" + content + "</td>";
      }
      rowsHtml += "<tr>" + tds + "</tr>";
    }
    return rowsHtml;
  }

  /**
   * 渲染表格主體資料列 HTML（純函式）。
   *
   * @param {Object} [options] - 表身組態
   * @returns {string} tbody 之 HTML 字串
   */
  function renderTableBody(options) {
    const opt = options || {};
    const items = Array.isArray(opt.items) ? opt.items : [];
    const columns = Array.isArray(opt.columns) ? opt.columns : [];
    const span = Number.isFinite(opt.colspan) && opt.colspan > 0 ? Math.floor(opt.colspan) : columns.length || 1;

    if (opt.loading) {
      return (
        "<tbody>" + renderTableStatusRow({ colspan: span, loading: true, loadingText: opt.loadingText }) + "</tbody>"
      );
    }
    if (items.length === 0) {
      return (
        "<tbody>" +
        renderTableStatusRow({ colspan: span, loading: false, emptyText: opt.emptyText, emptyHtml: opt.emptyHtml }) +
        "</tbody>"
      );
    }
    if (typeof opt.rowRenderer === "function") {
      let rows = "";
      for (let i = 0; i < items.length; i++) {
        const rowContent = opt.rowRenderer(items[i], i);
        rows += rowContent != null ? rowContent : "";
      }
      return "<tbody>" + rows + "</tbody>";
    }

    return "<tbody>" + renderDeclarativeRows_(items, columns) + "</tbody>";
  }

  /**
   * 高階純函式資料表格組合容器元件（paged-table-container）。
   *
   * @param {Object} [options] - 表格與分頁完整組態
   * @returns {string} 包含上方分頁、表格主體與下方分頁之容器 HTML 字串
   */
  function renderPagedTable(options) {
    const opt = options || {};
    const items = Array.isArray(opt.items) ? opt.items : [];
    const columns = Array.isArray(opt.columns) ? opt.columns : [];
    const span = Number.isFinite(opt.colspan) && opt.colspan > 0 ? Math.floor(opt.colspan) : columns.length || 1;
    const isLoading = Boolean(opt.loading || opt.isLoading);
    const hasPagination = opt.pagination && typeof renderPaginationBar === "function";

    let topPager = "";
    let bottomPager = "";
    if (hasPagination) {
      const basePagerOpts = Object.assign({}, opt.pagination, {
        disabled: isLoading || opt.pagination.disabled === true
      });
      if (opt.pagination.showTop !== false) {
        topPager = renderPaginationBar(Object.assign({}, basePagerOpts, { position: "top" }));
      }
      if (opt.pagination.showBottom !== false) {
        bottomPager = renderPaginationBar(Object.assign({}, basePagerOpts, { position: "bottom" }));
      }
    }

    const rawHeadHtml = opt.theadHtml || renderTableHead(columns);
    const headHtml = rawHeadHtml
      ? String(rawHeadHtml).replace(/<th\b(?![^>]*\bscope\s*=)([^>]*)>/gi, '<th scope="col"$1>')
      : "";
    const bodyHtml = renderTableBody({
      items: items,
      columns: columns,
      rowRenderer: opt.rowRenderer,
      loading: isLoading,
      loadingText: opt.loadingText,
      emptyText: opt.emptyText,
      emptyHtml: opt.emptyHtml,
      colspan: span
    });

    const tableClass = opt.className
      ? "data-table " + escapeHtml(opt.className)
      : "data-table table-centered table-hover";
    const tableStyle = opt.tableStyle ? ' style="' + escapeHtml(opt.tableStyle) + '"' : ' style="width:100%;"';
    const ariaBusy = isLoading ? ' aria-busy="true"' : "";
    const beforeHtml = opt.beforeTableHtml || "";
    const afterHtml = opt.afterTableHtml || "";

    const containerClass = opt.containerClassName
      ? escapeHtml(opt.containerClassName)
      : "table-responsive table-container";

    const tableHtml =
      '<div class="' +
      containerClass +
      '" style="overflow-x:auto;">' +
      '  <table class="' +
      tableClass +
      '"' +
      tableStyle +
      ariaBusy +
      ">" +
      headHtml +
      bodyHtml +
      "  </table>" +
      "</div>";

    return beforeHtml + topPager + tableHtml + bottomPager + afterHtml;
  }

  /**
   * 建立可注入依賴的 UI 模組實例。
   *
   * @param {Object} deps - MEA、window、document 與計時器依賴
   * @returns {Object} MEA.ui 公開方法與測試用內部函式
   */
  function createUiModule(deps) {
    const options = deps || {};
    const MEA = options.MEA || (typeof window !== "undefined" ? window.MEA : null) || {};
    const win = options.window || (typeof window !== "undefined" ? window : null) || {};
    const doc = options.document || (win && win.document) || (typeof document !== "undefined" ? document : null);
    const setTimeoutFn =
      typeof options.setTimeoutFn === "function"
        ? options.setTimeoutFn
        : function (fn, ms) {
            return setTimeout(fn, ms);
          };
    // task 6.2：事件綁定守護由共用模組提供（Node 由 require 取得，瀏覽器由全域取得）。
    const bindings = typeof require === "function" ? require("./eventBindings.js") : globalThis.MEA.eventBindings;

    /** 以 document 委派綁定所有 UI 事件；DOM 於 render 後重建仍可作用。 */
    function bindEventsOnce() {
      if (!bindings || !doc || typeof doc.addEventListener !== "function") return;
      bindings.delegate(doc, "change", "[data-ui-action='apply-style']", function (event, element) {
        applyStyle(element.value);
      });
      bindings.delegate(doc, "click", "[data-ui-action]", function (event, element) {
        const action = element.getAttribute("data-ui-action");
        if (action === "toggle-theme") return toggleTheme();
        if (action === "logout") {
          return MEA.auth && typeof MEA.auth.logout === "function" ? MEA.auth.logout() : undefined;
        }
        if (action === "login-mock") {
          return MEA.auth && typeof MEA.auth.loginMock === "function" ? MEA.auth.loginMock() : undefined;
        }
        if (action === "set-tab") {
          const tab = element.getAttribute("data-tab");
          const setTab = (MEA.navigation && MEA.navigation.setTab) || MEA.setTab;
          return typeof setTab === "function" ? setTab(tab) : undefined;
        }
        if (action === "open-user-guide") return openUserGuide();
        return undefined;
      });
    }

    bindEventsOnce();

    let modalRestoreFocus = null;

    /**
     * 套用顏色主題並寫入 localStorage。
     *
     * @param {string} theme - 主題名稱（dark 或 light）
     * @returns {string} 實際套用之主題名稱
     */
    function applyTheme(theme) {
      const value = theme === "dark" ? "dark" : "light";
      doc.documentElement.dataset.theme = value;
      try {
        win.localStorage.setItem(MEA.config.themeKey, value);
      } catch (error) {}
      return value;
    }

    /**
     * 取得目前套用之色彩主題。
     *
     * @returns {string} dark 或 light
     */
    function currentTheme() {
      return doc.documentElement.dataset.theme === "dark" ? "dark" : "light";
    }

    /**
     * 更新主題切換按鈕文字與圖示標籤。
     *
     * @param {string} next - 即將切換之主題
     */
    function updateThemeToggleLabels(next) {
      const btn = doc.getElementById("themeToggle");
      if (btn) btn.textContent = next === "dark" ? "◑ 淺色模式" : "◐ 深色模式";
      const loginToggle = doc.getElementById("loginThemeToggle");
      if (loginToggle) loginToggle.textContent = next === "dark" ? "◑ 淺色" : "◐ 深色";
    }

    /**
     * 切換色彩主題（淺色／深色互換）。
     */
    function toggleTheme() {
      const next = currentTheme() === "dark" ? "light" : "dark";
      applyTheme(next);
      updateThemeToggleLabels(next);
    }

    /**
     * 取得系統支援之介面風格設定清單副本。
     *
     * @returns {Array<Object>} 風格清單陣列
     */
    function getStyleList() {
      return (MEA.config.styles || []).slice();
    }

    /**
     * 取得目前套用之介面視覺風格 ID。
     *
     * @returns {string} 風格 ID
     */
    function currentStyle() {
      return doc.documentElement.dataset.style || MEA.config.defaultStyle || DEFAULT_STYLE;
    }

    /**
     * 套用指定之介面視覺風格並寫入 localStorage。
     *
     * @param {string} styleId - 風格 ID
     * @returns {string} 實際套用之風格 ID
     */
    function applyStyle(styleId) {
      const list = getStyleList();
      let valid = false;
      for (let i = 0; i < list.length; i++) {
        if (list[i].id === styleId) {
          valid = true;
          break;
        }
      }
      const target = valid ? styleId : MEA.config.defaultStyle || DEFAULT_STYLE;
      doc.documentElement.dataset.style = target;
      try {
        win.localStorage.setItem(MEA.config.styleKey, target);
      } catch (error) {}
      return target;
    }

    /**
     * 自 localStorage 初始化色彩主題與介面風格。
     */
    function initThemeAndStyle() {
      let savedTheme = "light";
      let savedStyle = MEA.config.defaultStyle || DEFAULT_STYLE;
      try {
        savedTheme = win.localStorage.getItem(MEA.config.themeKey) || "light";
        savedStyle = win.localStorage.getItem(MEA.config.styleKey) || savedStyle;
      } catch (e) {}
      applyTheme(savedTheme);
      applyStyle(savedStyle);
    }

    /**
     * 彈出 Toast 提示訊息。
     *
     * @param {string} message - 提示訊息文字
     * @param {string} [type] - 提示等級（ok, err, warn, info）
     * @param {number} [duration] - 停留毫秒數
     */
    function toast(message, type, duration) {
      const host = doc.getElementById("toastHost");
      if (!host) return;

      const kind = resolveToastKind(type);
      const t = createToastElement(doc, message, kind);
      host.appendChild(t);

      setTimeoutFn(function () {
        t.classList.add("visible");
      }, 10);

      scheduleToastRemoval(t, resolveToastDuration(kind, duration), setTimeoutFn);
    }

    /**
     * 收集容器內可聚焦元素，供初始焦點與 Tab 焦點陷阱使用。
     *
     * @param {Object} root - 查詢根元素
     * @returns {Array} 可聚焦元素清單
     */
    function collectFocusableElements(root) {
      if (!root || typeof root.querySelectorAll !== "function") return [];
      const found = root.querySelectorAll("button, input, select, textarea, a[href], [tabindex]");
      const nodes = [];
      for (let i = 0; i < found.length; i++) {
        const node = found[i];
        const tabIndex = typeof node.getAttribute === "function" ? node.getAttribute("tabindex") : null;
        if (node.disabled === true || tabIndex === "-1") continue;
        nodes.push(node);
      }
      return nodes;
    }

    /**
     * 對話框開啟時標記背景地標為 inert，關閉時還原，避免焦點與點擊穿透。
     *
     * @param {boolean} enabled - 是否啟用 inert
     */
    function setBackgroundInert(enabled) {
      if (!doc || typeof doc.querySelectorAll !== "function") return;
      const nodes = doc.querySelectorAll(".app-nav, .app-content");
      for (let i = 0; i < nodes.length; i++) {
        if (enabled) {
          if (typeof nodes[i].setAttribute === "function") nodes[i].setAttribute("inert", "");
        } else if (typeof nodes[i].removeAttribute === "function") {
          nodes[i].removeAttribute("inert");
        }
      }
    }

    /**
     * 開啟互動式對話框，具備焦點陷阱與 ESC 關閉支援。
     *
     * @param {string} title - 對話框標題
     * @param {string} contentHtml - 內容 HTML 字串
     * @param {Array<Object>} [buttons] - 底部操作按鈕定義清單
     */
    function modal(title, contentHtml, buttons) {
      const host = doc.getElementById("modalHost");
      if (!host) return;

      const previousFocus = doc.activeElement || null;
      host.innerHTML = "";
      const overlay = doc.createElement("div");
      overlay.className = "modal-overlay";
      if (typeof overlay.setAttribute === "function") {
        overlay.setAttribute("role", "dialog");
        overlay.setAttribute("aria-modal", "true");
        overlay.setAttribute("aria-labelledby", MODAL_TITLE_ID);
      }

      const card = doc.createElement("div");
      card.className = "modal-card";

      const head = doc.createElement("div");
      head.className = "modal-header";
      head.innerHTML =
        '<h3 class="modal-title" id="' +
        MODAL_TITLE_ID +
        '">' +
        escapeHtml(title) +
        '</h3><button type="button" class="modal-close" id="modalCloseBtn" aria-label="關閉對話框">✕</button>';

      const body = doc.createElement("div");
      body.className = "modal-body";
      body.innerHTML = contentHtml;

      const foot = doc.createElement("div");
      foot.className = "modal-footer";

      const footButtons = [];
      const btns = buttons || [{ text: "關閉", primary: true, onClick: closeModal }];
      btns.forEach(function (btn) {
        const b = doc.createElement("button");
        b.className = btn.className || "btn " + (btn.primary ? "primary" : "secondary");
        if (typeof b.setAttribute === "function") b.setAttribute("type", "button");
        b.textContent = btn.text || btn.label || "";
        b.onclick = function () {
          if (typeof btn.onClick === "function") {
            btn.onClick();
          } else {
            closeModal();
          }
        };
        foot.appendChild(b);
        footButtons.push(b);
      });

      card.appendChild(head);
      card.appendChild(body);
      card.appendChild(foot);
      overlay.appendChild(card);
      host.appendChild(overlay);
      setBackgroundInert(true);

      modalRestoreFocus = previousFocus;

      const closeBtn = doc.getElementById("modalCloseBtn");
      if (closeBtn) closeBtn.onclick = closeModal;
      overlay.onclick = function (e) {
        if (e.target === overlay) closeModal();
      };

      function collectFocusables() {
        const closeNodes = closeBtn ? [closeBtn] : [];
        return closeNodes.concat(collectFocusableElements(body), footButtons);
      }

      const focusables = collectFocusables();
      if (focusables.length > 0 && typeof focusables[0].focus === "function") {
        focusables[0].focus();
      }

      overlay.onkeydown = function (e) {
        if (!e) return;
        const key = e.key || "";
        if (key === "Escape" || key === "Esc" || e.keyCode === 27) {
          if (typeof e.preventDefault === "function") e.preventDefault();
          closeModal();
          return;
        }
        if (key !== "Tab" && e.keyCode !== 9) return;
        const nodes = collectFocusables();
        if (nodes.length === 0) return;
        const index = nodes.indexOf(doc.activeElement);
        if (e.shiftKey) {
          if (index <= 0) {
            if (typeof e.preventDefault === "function") e.preventDefault();
            nodes[nodes.length - 1].focus();
          }
        } else if (index === -1 || index === nodes.length - 1) {
          if (typeof e.preventDefault === "function") e.preventDefault();
          nodes[0].focus();
        }
      };
    }

     * 關閉當前開啟之對話框並還原前次焦點。
     */
    function closeModal() {
      const host = doc.getElementById("modalHost");
      if (host) host.innerHTML = "";
      setBackgroundInert(false);
      const restoreTarget = modalRestoreFocus;
      modalRestoreFocus = null;
      if (restoreTarget && typeof restoreTarget.focus === "function") restoreTarget.focus();

     * 取得使用者操作手冊的 Web App 文件路由網址（優先使用部署 exec/dev 網址）。
     *
     * @returns {string} 文件路由網址
     */
    function getUserGuideUrl() {
      const qs = "?page=docs%2Fuser-guide.html";
      let base = "";

      if (typeof win !== "undefined" && win) {
        const injected = String(win.GAS_WEBAPP_URL || "").trim();
        if (/^https?:\/\//i.test(injected)) base = injected;

        if (!base) {
          const href = String((win.location && win.location.href) || "").trim();
          if (
            /\/macros\/.+\/(exec|dev)(\?|#|$)/i.test(href) &&
            !/googleusercontent\.com\/userCodeAppPanel/i.test(href)
          ) {
            base = href.split("?")[0].split("#")[0];
          }
        }
      }

      if (!base) {
        const cfg = String((MEA.state && MEA.state.publicConfig && MEA.state.publicConfig.webAppUrl) || "").trim();
        if (/^https?:\/\//i.test(cfg)) base = cfg;
      }

      return base ? base.replace(/\?.*$/, "").replace(/#.*$/, "").replace(/\/+$/, "") + qs : qs;
    }

    /**
     * 函式防彈跳（Debounce）。
     *
     * @param {Function} fn - 目標執行函式
     * @param {number} [delay=250] - 延遲毫秒數
     * @returns {Function} 防彈跳包裹後之函式
     */
    function debounce(fn, delay) {
      let timer = null;
      const wait = typeof delay === "number" ? delay : 250;
      return function () {
        const context = this;
        const args = arguments;
        if (timer) {
          clearTimeout(timer);
        }
        timer = setTimeoutFn(function () {
          fn.apply(context, args);
        }, wait);
      };
    }

    }

    function bindEventsOnce() {
      if (!bindings || !doc || typeof doc.addEventListener !== "function") return;
      bindings.delegate(doc, "click", "[data-auth-action='switch-google-account']", function () {
        switchGoogleAccount();
      });
    }

    bindEventsOnce();

    let gisPromise = null;
    let initializedClientId = "";
    let logoutBusy = false;

    /**
     * 取得系統角色代碼至顯示名稱對照表。
     *
     * @returns {Object} 角色對照字典
     */
    function getRoleNames() {
      return (MEA.config && MEA.config.roleNames) || {};
    }

    /**
     * 判斷目前是否處於 Mock 測試模式。
     *
     * @returns {boolean} 是否為 Mock 模式
     */
    function isMock() {
      return !!(MEA.config && MEA.config.mock);
    }

    /**
     * 取得應用程式全域公開設定物件。
     *
     * @returns {Object} 公開設定物件
     */
    function getPublicConfig() {
      return (MEA.state && MEA.state.publicConfig) || {};
    }

    /**
     * 只有後端公開設定明確標記待開通時，才在登入請求附上 bootstrap 旗標。
     *
     * @returns {boolean} 是否需附帶 bootstrap 旗標
     */
    function shouldRequestBootstrap() {
      return getPublicConfig().needsBootstrap === true;
    }

    /**
     * 檢查是否處於 GAS 原生託管環境。
     *
     * @returns {boolean} 是否為 GAS 託管環境
     */
    function isGasHosted() {
      return detectGasHosting(MEA.config, win ? win.google : null);
    }

    /**
     * 非同步載入 Google Identity Services SDK 腳本。
     *
     * @returns {Promise<Object>} Google Accounts ID API 物件
     */
    function loadGis() {
      if (gisPromise) return gisPromise;
      gisPromise = new Promise(function (resolve, reject) {
        const host = win || {};
        if (host.google && host.google.accounts && host.google.accounts.id) {
          resolve(host.google.accounts.id);
          return;
        }
        const existing =
          doc && typeof doc.querySelector === "function" ? doc.querySelector('script[data-gas-gis="1"]') : null;
        if (existing) {
          existing.addEventListener("load", function () {
            resolve(host.google.accounts.id);
          });
          existing.addEventListener("error", function () {
            reject(safeErrors.createSafeError("Google 登入服務載入失敗"));
          });
          return;
        }
        const script = doc.createElement("script");
        script.src = GIS_SRC;
        script.async = true;
        script.defer = true;
        script.dataset.gasGis = "1";
        script.onload = function () {
          if (host.google && host.google.accounts && host.google.accounts.id) {
            resolve(host.google.accounts.id);
          } else {
            reject(safeErrors.createSafeError("Google 登入服務載入失敗"));
          }
        };
        script.onerror = function () {
          reject(safeErrors.createSafeError("Google 登入服務載入失敗，請檢查網路連線"));
        };

     * 套用登入成功或失敗回應並更新應用程式狀態。
     *
     * @param {Object} result - 登入呼叫結果
     * @returns {Promise<Object|null>} 成功時回傳使用者物件，失敗時回傳 null
     */
    function applyLoginSuccess(result) {

        MEA.setState(buildLoginFailureState(result));
        return Promise.resolve(null);

      applyCsrfToken(MEA.api, result.csrfToken);
      const user = buildLoginUser(result, getRoleNames());
      MEA.setState(buildLoginSuccessState(user));
      const toast = getLoginToast(user);
      MEA.ui.toast(toast.message, toast.level);
      invokeFetchStats(MEA);
      return Promise.resolve(user);
    }

    /**
     * 處理 Google Identity Services 登入回傳之憑證。

     * @param {Object} response - GIS 憑證回應物件
     */
    function handleCredential(response) {
      const credential = response && response.credential ? String(response.credential) : "";
      if (credential === "") {
        MEA.setState({ loginBusy: false, loginError: "未取得 Google 登入憑證，請重試" });
        return;
      }
      MEA.setState({ loginBusy: true, loginError: "" });
      MEA.api
        .call("login", { credential: credential, bootstrap: shouldRequestBootstrap() })
        .then(applyLoginSuccess)
        .catch(handleAuthCallFailure);
    }

    /**
     * 建立 Google OAuth 導向授權網址。
     *
     * @param {string} clientId - OAuth 用戶端 ID
     * @param {string} redirectUri - 重新導向網址
     * @returns {string} 授權端點網址
     */
    function buildGoogleAuthUrl(clientId, redirectUri) {
      return buildGoogleAuthUrlWithOptions(clientId, redirectUri, {
        btoa: win && typeof win.btoa === "function" ? win.btoa.bind(win) : null
      });
    }

    /**
     * 導向至 Google 帳戶切換器網址（適用於 GAS 託管容器內）。
     */
    function switchGoogleAccount() {
      const config = getPublicConfig();
      const webAppUrl = resolveWebAppUrl(config, win);
      if (webAppUrl === "") {
        MEA.setState({ loginBusy: false, loginError: MISSING_WEBAPP_URL_ERROR });
        return;
      }
      const authUrl = buildAccountChooserUrl(webAppUrl, config.allowedDomain || "");
      if (authUrl === "") {
        MEA.setState({ loginBusy: false, loginError: MISSING_CHOOSER_URL_ERROR });
        return;
      }
      MEA.setState({ loginBusy: true, loginError: "" });
      navigateToUrl(win, authUrl);
    }

    /**
     * 以 Google OAuth 重新導向方式執行登入。
     */
    function loginWithGoogleRedirect() {
      const setup = validateRedirectSetup(getPublicConfig(), win);
      if (setup.message !== "") {
        MEA.setState({ loginError: setup.message });
        return;
      }
      MEA.setState({ loginBusy: true, loginError: "" });
      const authUrl = buildGoogleAuthUrl(setup.clientId, setup.redirectUri);
      navigateToUrl(win, authUrl);
    }

    /**
     * 在 GAS 託管環境中使用目前啟用的 Google 帳戶登入。
     */
    function loginActiveUser() {
      MEA.setState({ loginBusy: true, loginError: "" });
      MEA.api
        .call("loginWithActiveUser", { bootstrap: shouldRequestBootstrap() })
        .then(applyLoginSuccess)
        .catch(handleAuthCallFailure);
    }

    /**
     * 建立 GIS SDK 準備就緒之按鈕渲染回呼函式。
     *
     * @param {HTMLElement} host - 按鈕容器元素

    function createGisReadyHandler(host, clientId) {
      return function (id) {
        if (initializedClientId !== clientId) {

          initializedClientId = clientId;

        host.innerHTML = "";
        id.renderButton(host, buildGisRenderOptions(MEA.ui.currentTheme()));

    }

    /**
     * 處理 GIS SDK 載入或執行失敗。
     *
     * @param {*} error - 例外物件
     */
    function handleGisFailure(error) {
      MEA.setState({ loginError: safeErrors.resolveSafeMessage(error, DEFAULT_LOGIN_ERROR) });
    }

    /**
     * 統一處理 API 呼叫拒絕，避免未捕獲的 Promise 例外並提供明確回饋。
     *
     * @param {*} error - 例外或錯誤物件
     */
    function handleAuthCallFailure(error) {
      const message = safeErrors.resolveSafeMessage(error, DEFAULT_LOGIN_ERROR);
      MEA.setState({ loginBusy: false, loginError: message });
      MEA.ui.toast(message, "err");
    }

    /**
     * 依當前執行環境渲染適當的 Google 登入按鈕（GIS 按鈕、GAS 託管按鈕或提示訊息）。
     */
    function renderGoogleButton() {
      const prepared = prepareGoogleButton({
        mock: isMock(),
        publicConfig: getPublicConfig(),
        document: doc,
        gasHosted: isGasHosted(),
        loginBusy: !!(MEA.state && MEA.state.loginBusy)
      });
      if (!prepared) return;
      if (prepared.html !== "") {
        prepared.host.innerHTML = prepared.html;
        return;
      }
      loadGis().then(createGisReadyHandler(prepared.host, prepared.clientId)).catch(handleGisFailure);
    }

    /**
     * 於 Mock 測試模式下模擬登入動作。
     */
    function loginMock() {
      MEA.setState({ loginBusy: true, loginError: "" });
      MEA.api
        .call("login", { mock: true, bootstrap: shouldRequestBootstrap() })
        .then(applyLoginSuccess)
        .catch(handleAuthCallFailure);
    }

    /**
     * 延遲排程渲染 Google 登入按鈕，確保 DOM 節點已掛載。
     */
    function scheduleRenderGoogleButton() {
      setTimeoutFn(renderGoogleButton, 50);
    }

    /**
     * 執行使用者登出，清除狀態與 Token。
     *
     * @returns {Promise<boolean>} 是否成功完成登出流程
     */
    function logout() {
      if (logoutBusy) return Promise.resolve(false);
      logoutBusy = true;
      MEA.setState({ logoutBusy: true, loginError: "" });
      return MEA.api
        .call("logout", {})
        .then(function () {
          MEA.api.setToken("");
          MEA.api.setCsrfToken("");
          MEA.setState({
            view: "login",
            user: null,
            loginError: "",
            loginBusy: false,
            logoutBusy: false
          });
          logoutBusy = false;
          scheduleRenderGoogleButton();
          return true;
        })
        .catch(function (error) {
          logoutBusy = false;
          MEA.setState({ logoutBusy: false });
          MEA.ui.toast(normalizeLogoutError(error), "err");
          return false;
        });
    }

    /**
     * 套用工作階段驗證成功狀態。
     *
     * @param {Object} result - Session 驗證回應
     * @returns {boolean} 是否驗證成功
     */
    function applySessionSuccess(result) {
      if (!isOkResult(result)) return false;
      applyCsrfToken(MEA.api, result.csrfToken);
      MEA.setState(buildSessionSuccessState(result, getRoleNames()));
      invokeFetchStats(MEA);
      return true;
    }

    /**
     * 還原既有工作階段（由 Token 或 Mock 還原登入狀態）。
     */
    function restore() {
      const token = MEA.api.getToken();
      if (isMock()) {
        MEA.api
          .call("getSession", {})
          .then(function (result) {
            if (!applySessionSuccess(result)) {
              MEA.setState(buildSessionFailureState(result));
              scheduleRenderGoogleButton();
            }
          })
          .catch(handleAuthCallFailure);
        return;
      }
      if (!token) {
        MEA.setState({ view: "login" });
        scheduleRenderGoogleButton();
        return;
      }
      MEA.api
        .call("getSession", { token: token })
        .then(function (result) {
          if (!applySessionSuccess(result)) {
            MEA.api.setToken("");
            MEA.api.setCsrfToken("");
            MEA.setState(buildSessionFailureState(result));
            scheduleRenderGoogleButton();
          }
        })
        .catch(handleAuthCallFailure);
    }

    return {
      loadGis: loadGis,
      isGasHosted: isGasHosted,
      buildGoogleAuthUrl: buildGoogleAuthUrl,
      buildAccountChooserUrl: buildAccountChooserUrl,
      switchGoogleAccount: switchGoogleAccount,
      loginWithGoogleRedirect: loginWithGoogleRedirect,
      loginActiveUser: loginActiveUser,
      renderGoogleButton: renderGoogleButton,
      handleCredential: handleCredential,
      applyLoginSuccess: applyLoginSuccess,
      loginMock: loginMock,
      logout: logout,
      restore: restore
    };
  }

  return {
    createAuthController: createAuthController,
    isOkResult: isOkResult,
    buildLoginFailureState: buildLoginFailureState,
    buildLoginUser: buildLoginUser,
    buildLoginSuccessState: buildLoginSuccessState,
    getLoginToast: getLoginToast,
    applyCsrfToken: applyCsrfToken,
    invokeFetchStats: invokeFetchStats,
    encodeAuthState: encodeAuthState,
    saveAuthState: saveAuthState,
    readAuthState: readAuthState,
    clearAuthState: clearAuthState,
    buildGoogleAuthUrl: buildGoogleAuthUrlWithOptions,
    buildChooserContinueUrl: buildChooserContinueUrl,
    normalizeAllowedDomain: normalizeAllowedDomain,
    buildAccountChooserUrl: buildAccountChooserUrl,
    resolveWebAppUrl: resolveWebAppUrl,
    validateRedirectSetup: validateRedirectSetup,
    navigateToUrl: navigateToUrl,
    detectGasHosting: detectGasHosting,
    buildGasHostedLoginButtonHtml: buildGasHostedLoginButtonHtml,
    prepareGoogleButton: prepareGoogleButton,
    buildGisInitializeOptions: buildGisInitializeOptions,
    buildGisRenderOptions: buildGisRenderOptions,
    buildSessionUser: buildSessionUser,
    buildSessionSuccessState: buildSessionSuccessState,
    getSessionErrorMessage: getSessionErrorMessage,
    buildSessionFailureState: buildSessionFailureState,
    normalizeLogoutError: normalizeLogoutError,
    constants: {
      GIS_SRC: GIS_SRC,
      GOOGLE_AUTH_URL: GOOGLE_AUTH_URL,
      GOOGLE_ACCOUNT_CHOOSER_URL: GOOGLE_ACCOUNT_CHOOSER_URL,
      CLIENT_ID_HINT_HTML: CLIENT_ID_HINT_HTML,
      DEFAULT_LOGIN_ERROR: DEFAULT_LOGIN_ERROR,
      DEFAULT_LOGOUT_ERROR: DEFAULT_LOGOUT_ERROR,
      SESSION_EXPIRED_ERROR: SESSION_EXPIRED_ERROR
    }
  };
});

(function (root, factory) {

  /**
   * 判斷前幾列是否出現課綱寬表識別標頭。
   *
   * @param {Array} rows - 工作表列資料
   * @returns {boolean} 是否為課程代碼工作表
   */
  function looksLikeCourseCodes(rows) {
    const firstRows = (rows || []).slice(0, 3);
    for (let i = 0; i < firstRows.length; i++) {
      const row = firstRows[i] || [];
      for (let j = 0; j < row.length; j++) {
        const val = String(row[j] || "").trim();
        if (val === "課程代碼" || val === "科目屬性" || val === "科目名稱") {
          return true;
        }
      }
    }
    return false;
  }

  /**
   * 挑選課程代碼工作表；找不到特色標頭時退回第一個有資料的工作表。
   * 每個工作表最多解析一次，避免退回邏輯重複呼叫 SheetJS。
   *
   * @param {Object} workbook - 試算表活頁簿
   * @param {Function} readRows - 讀取單一工作表列的函式
   * @returns {{sheetName: string, rows: Array}} 挑選結果
   */
  function pickCourseSheetRows(workbook, readRows) {
    const names = (workbook && workbook.SheetNames) || [];
    const reader =
      typeof readRows === "function"
        ? readRows
        : function () {
            return [];
          };
    const rowsBySheet = Object.create(null);
    let firstSheetWithRows = null;

    for (let i = 0; i < names.length; i++) {
      const sheetName = names[i];
      let rows;
      if (Object.prototype.hasOwnProperty.call(rowsBySheet, sheetName)) {
        rows = rowsBySheet[sheetName];
      } else {
        rows = reader(sheetName) || [];
        rowsBySheet[sheetName] = rows;

      if (rows.length === 0) continue;

      if (!firstSheetWithRows) {
        firstSheetWithRows = { sheetName: sheetName, rows: rows };

      }

  function renderSampleRowCellsHtml(row, escapeHtml) {

      typeof comparator === "function"
        ? comparator
        : typeof MEA !== "undefined" &&
            MEA &&
            MEA.courseData &&
            typeof MEA.courseData.compareDepartmentsByCode === "function"
          ? MEA.courseData.compareDepartmentsByCode
          : typeof window !== "undefined" &&
              window.MEA &&
              window.MEA.courseData &&
              typeof window.MEA.courseData.compareDepartmentsByCode === "function"
            ? window.MEA.courseData.compareDepartmentsByCode
            : function (a, b) {
                return String(a || "").localeCompare(String(b || ""), "zh-TW");
              };
    return depts.sort(cmp);
  }

  /**
   * 包裹匯入頁籤的外層面板。

   * @param {string} contentHtml - 上傳區或預覽卡片 HTML

  /**
   * 產生唯一的匯入操作識別碼 (UUID-like)
   *
   * @returns {string} 識別碼
   */
  function generateImportId() {
    return "imp-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
  }

  /**
   * 建構匯入成功後的狀態更新物件（不可變）
   *
   * @param {Object} entry - 當前匯入項目
   * @param {Object} result - 後端回傳結果
   * @returns {Object} State patch 物件
   */
  function buildImportSuccessPatch(entry, result) {
    return {
      imports: {
        courseCodes: Object.assign({}, entry, { imported: true })
      },
      importLast: result,
      importBusy: false
    };
  }

  /**
   * 建立可注入依賴的匯入模組實例。
   *
   * @param {Object} deps - MEA、window、document 與選擇性 FileReader 依賴
   * @returns {Object} MEA.imports 公開方法與測試用內部函式
   */
  function createImportsModule(deps) {
    const options = deps || {};
    const safeErrors = moduleHelpers.resolveSafeErrors(options);
    const MEA = options.MEA || (typeof window !== "undefined" ? window.MEA : null) || {};
    const win = options.window || (typeof window !== "undefined" ? window : null) || {};
    const doc = options.document || (win && win.document) || (typeof document !== "undefined" ? document : null);
    const FileReaderCtor =
      options.FileReader || (win && win.FileReader) || (typeof FileReader !== "undefined" ? FileReader : null);
    // task 6.2：事件綁定守護由共用模組提供（Node 由 require 取得，瀏覽器由全域取得）。
    const bindings = typeof require === "function" ? require("./eventBindings.js") : globalThis.MEA.eventBindings;

    /** 以 document 委派綁定拖曳區、檔案輸入與預覽卡片事件。 */
    function bindEventsOnce() {
      if (!bindings || !doc || typeof doc.addEventListener !== "function") return;
      bindings.delegate(doc, "dragover", "[data-import-dropzone]", function (event, element) {
        handleDragOver(event, element);
      });
      bindings.delegate(doc, "dragleave", "[data-import-dropzone]", function (event, element) {
        handleDragLeave(event, element);
      });
      bindings.delegate(doc, "drop", "[data-import-dropzone]", function (event, element) {
        handleDrop(event, element);
      });
      bindings.delegate(doc, "keydown", "[data-import-dropzone]", function (event) {
        handleDropzoneKey(event);
      });
      bindings.delegate(doc, "click", "[data-import-dropzone]", function () {
        pickFile();
      });
      bindings.delegate(doc, "change", "[data-import-action='file-select']", function (event, element) {
        handleFileSelect(element);
      });
      bindings.delegate(doc, "change", "[data-import-action='filter-dept']", function (event, element) {
        handleDeptFilter(element.value);
      });
      bindings.delegate(doc, "click", "[data-import-action]", function (event, element) {
        const action = element.getAttribute("data-import-action");
        if (action === "reset") return resetImport();
        if (action === "import") return doImport();
        return undefined;
      });
    }

    bindEventsOnce();

    let sheetJsPromise = null;

    /**
     * 非同步載入 SheetJS 解析套件（支援 SRI 驗證與 CDN 降級）。
     *
     * @returns {Promise<Object>} SheetJS XLSX 物件
     */
    function loadSheetJs() {
      if (sheetJsPromise) return sheetJsPromise;
      if (win.XLSX) {
        sheetJsPromise = Promise.resolve(win.XLSX);
        return sheetJsPromise;
      }

      sheetJsPromise = new Promise(function (resolve, reject) {
        let index = 0;

        function attempt() {
          if (index >= SHEETJS_CDN.length) {
            reject(new Error("無法載入 SheetJS 解析套件，請確認網路連線"));
            return;
          }
          const script = doc.createElement("script");
          script.src = SHEETJS_CDN[index++];
          script.async = true;
          script.integrity = SHEETJS_SRI;
          script.crossOrigin = "anonymous";
          script.onload = function () {
            if (win.XLSX) {
              resolve(win.XLSX);
            } else {
              attempt();
            }
          };
          script.onerror = attempt;
          doc.head.appendChild(script);
        }

        attempt();
      });

      return sheetJsPromise;
    }

    /**
     * 讀取活頁簿中指定工作表的所有資料列為二維陣列。
     *
     * @param {Object} workbook - XLSX 活頁簿
     * @param {string} sheetName - 工作表名稱
     * @returns {Array<Array>} 資料列二維陣列
     */
    function rowsOfSheet(workbook, sheetName) {
      const sheet = workbook && workbook.Sheets ? workbook.Sheets[sheetName] : null;
      if (!sheet) return [];
      return win.XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        raw: false,
        defval: "",
        blankrows: false
      });
    }

    /**
     * 建立綁定該活頁簿之工作表資料讀取函式。
     *
     * @param {Object} workbook - XLSX 活頁簿
     * @returns {Function} 讀取特定工作表列之函式
     */
    function readRowsOfSheet(workbook) {
      return function (sheetName) {
        return rowsOfSheet(workbook, sheetName);
      };
    }

    /**
     * 以 FileReader 非同步讀取上傳檔案並解析為 XLSX 活頁簿。
     *
     * @param {File} file - 瀏覽器 File 物件
     * @returns {Promise<Object>} XLSX 活頁簿 Promise
     */
    function readFileRows(file) {
      return loadSheetJs().then(function (XLSX) {
        return new Promise(function (resolve, reject) {
          const reader = new FileReaderCtor();
          reader.onload = function () {
            try {
              const data = new Uint8Array(reader.result);
              const workbook = XLSX.read(data, { type: "array", cellDates: false });
              resolve(workbook);
            } catch (error) {
              reject(new Error("檔案解析失敗，請確認格式為 .xlsx、.xls 或 .ods"));
            }
          };
          reader.onerror = function () {
            reject(new Error("讀取檔案失敗"));
          };
          reader.readAsArrayBuffer(file);
        });
      });
    }

    /**
     * 預先執行 1NF 正規化轉換並產生預覽樣本與統計。
     *
     * @param {Array<Array>} rows - 原始工作表二維陣列
     * @returns {{payload: Array, payloadPreNormalized: boolean, stats: Object, sample: Array}} 預覽資料結構
     */
    function previewCourseCodes(rows) {
      const result = MEA.courseData.normalizeCourseCodes(rows, { withStats: true });
      return {
        payload: result.rows,
        payloadPreNormalized: true,
        stats: result.stats,
        sample: result.rows.slice(0, 5)
      };
    }

    /**
     * 預覽指定檔案，觸發檔案讀取、工作表挑選與正規化預覽。
     *
     * @param {File} file - 上傳之檔案
     * @returns {Promise<Object|null>} 匯入項目物件或失敗時 null
     */
    function previewFile(file) {
      if (!file) return Promise.resolve(null);
      MEA.setState({ importBusy: true });

      return readFileRows(file)
        .then(function (workbook) {
          const picked = pickCourseSheetRows(workbook, readRowsOfSheet(workbook));
          if (picked.rows.length === 0) {
            throw new Error("工作表中找不到有效資料");
          }
          const preview = previewCourseCodes(picked.rows);
          const entry = Object.assign(
            {
              fileName: file.name,
              fileSize: file.size,
              sheetName: picked.sheetName,
              imported: false
            },
            preview
          );

          MEA.setState({
            imports: { courseCodes: entry },
            importBusy: false
          });

          MEA.ui.toast(file.name + " 解析完成（共 " + preview.stats.expandedRows + " 筆 1NF 紀錄）", "ok");
          return entry;
        })
        .catch(function (error) {
          MEA.setState({ importBusy: false });
          MEA.ui.toast(safeErrors.resolveSafeMessage(error, "解析檔案失敗，請稍後再試"), "err");
          return null;
        });
    }

    /**
     * 程式化觸發隱藏的 file input 點擊。
     */
    function pickFile() {
      const input = doc.getElementById("fileInput");
      if (input) input.click();
    }

    /**
     * 讓鍵盤使用者以 Enter 或 Space 觸發檔案選擇。
     *
     * @param {Object} e - 鍵盤事件
     */
    function handleDropzoneKey(e) {
      if (!e) return;
      const key = e.key || (e.keyCode === 32 ? " " : "");
      if (key !== "Enter" && key !== " " && key !== "Spacebar") return;
      if (typeof e.preventDefault === "function") e.preventDefault();
      pickFile();
    }

    /**
     * 處理檔案選擇變更事件。
     *
     * @param {HTMLInputElement} input - 檔案輸入控制項
     */
    function handleFileSelect(input) {
      const file = input && input.files && input.files[0];
      if (input) input.value = "";
      if (file) previewFile(file);
    }

    /**
     * 處理拖曳進入區域事件。
     *
     * @param {DragEvent} e - 拖曳事件
     * @param {HTMLElement} [element] - 目標元素
     */
    function handleDragOver(e, element) {
      e.preventDefault();
      const zone = element || doc.getElementById("uploadDropzone");
      if (zone && zone.classList) zone.classList.add("dragover");
    }

    /**
     * 處理拖曳離開區域事件。
     *
     * @param {DragEvent} e - 拖曳事件
     * @param {HTMLElement} [element] - 目標元素
     */
    function handleDragLeave(e, element) {
      e.preventDefault();
      const zone = element || doc.getElementById("uploadDropzone");
      if (zone && zone.classList) zone.classList.remove("dragover");
    }

    /**
     * 處理拖曳釋放檔案事件。
     *
     * @param {DragEvent} e - 拖曳事件
     * @param {HTMLElement} [element] - 目標元素
     */
    function handleDrop(e, element) {
      e.preventDefault();
      const zone = element || doc.getElementById("uploadDropzone");
      if (zone && zone.classList) zone.classList.remove("dragover");

      const file = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
      if (file) previewFile(file);
    }

    /**
     * 重設匯入預覽狀態，返回初始檔案上傳區。
     */
    function resetImport() {
      MEA.setState({
        imports: {},
        importLast: null
      });
    }

    /**
     * 處理後端匯入成功回應。
     *
     * @param {Object} entry - 當前匯入項目
     * @param {Object} result - 後端回應
     */
    function handleImportResult(entry, result) {
      if (!result || result.ok !== true) {
        MEA.setState({ importBusy: false });
        MEA.ui.toast((result && result.message) || "匯入失敗", "err");
        return;
      }

      MEA.setState(buildImportSuccessPatch(entry, result));

      MEA.ui.toast(
        result.idempotent === true
          ? "此匯入已處理完成，不重複寫入（冪等命中）"
          : "課程代碼匯入完成！已儲存至「正規化課程代碼」工作表",
        "ok"
      );

      if (MEA.courses && typeof MEA.courses.fetchList === "function") {
        MEA.courses.fetchList(1);
      }
    }

    /**
     * 處理後端匯入失敗或連線錯誤。
     *
     * @param {*} error - 例外物件
     */
    function handleImportError(error) {
      MEA.setState({ importBusy: false });
      const detail = safeErrors.resolveSafeMessage(error, "匯入失敗，請稍後再試");
      MEA.ui.toast(detail + "（系統不會自動重送，請確認後再手動重試）", "err");
    }

    /**
     * 確認將預覽之 1NF 課程代碼資料批次匯入後端試算表。
     */
    function doImport() {
      const entry = (MEA.state.imports || {}).courseCodes;
      if (!entry || !Array.isArray(entry.payload) || entry.payload.length === 0) {
        MEA.ui.toast("請先選擇並解析課程代碼檔案", "warn");
        return;
      }

      const importId = entry.importId || generateImportId();
      if (!entry.importId) {
        entry.importId = importId;
        const nextImports = Object.assign({}, MEA.state.imports, {
          courseCodes: Object.assign({}, entry, { importId: importId })
        });
        MEA.setState({ imports: nextImports });
      }

      MEA.setState({ importBusy: true });
      MEA.ui.toast("正在寫入 Google 試算表（共 " + entry.payload.length + " 筆）...", "info");

      MEA.api
        .call(
          "importCourseCodes",
          {
            rows: entry.payload,
            preNormalized: true,
            importId: importId
          },
          { retry: false }
        )
        .then(function (result) {
          handleImportResult(entry, result);
        })
        .catch(handleImportError);
    }

    /**
     * 切換預覽表格之科別篩選。
     *
     * @param {string} dept - 選定之科別名稱
     */
    function handleDeptFilter(dept) {
      const current = MEA.state.imports || {};
      const currentEntry = current.courseCodes;
      if (!currentEntry) return;
      const nextEntry = Object.assign({}, currentEntry, {
        deptFilter: dept || ""
      });
      MEA.setState({
        imports: Object.assign({}, current, {
          courseCodes: nextEntry
        })
      });
    }

    /**
     * 渲染課程代碼匯入主畫面。
     *
     * @returns {string} 匯入面板 HTML 字串
     */
    function renderView() {
      const entry = (MEA.state.imports || {}).courseCodes;
      const busy = MEA.state.importBusy;
      const user = MEA.state.user || {};
      const canImport = canImportCourseCodes(user);
      const safeEscapeHtml =
        options.escapeHtml ||
        (MEA.ui && MEA.ui.escapeHtml) ||
        function (str) {
          return String(str == null ? "" : str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        };
      const safeNumber =
        options.number ||
        (MEA.ui && MEA.ui.number) ||
        function (val) {
          const n = Number(val);
          return isNaN(n) ? "0" : String(n);
        };
      const compareFn =
        options.compareDepartmentsByCode ||
        (MEA.courseData && typeof MEA.courseData.compareDepartmentsByCode === "function"
          ? MEA.courseData.compareDepartmentsByCode
          : function (a, b) {
              return String(a || "").localeCompare(String(b || ""), "zh-TW");
            });

      const contentHtml = entry

    function normalizeErrorMessage(error, fallback) {

    /**

     * @param {number} targetPage - 目標頁碼
     * @returns {Object} API payload
     */
    function buildCourseQuery(cur, targetPage) {
      return {

        department: cur.department || "",
        academicYear: cur.academicYear || "",
        semester: cur.semester || "",
        page: targetPage,

    function buildCourseFetchKey(query) {

        query.department || "",
        query.academicYear || "",

        query.page || 1,
        query.pageSize || 30

    }

        total: result.total || 0,

        totalPages: result.totalPages || 1

    }

    function handleFetchStatsSuccess(result) {

     * @param {string} selectedDepartment - 目前選取的科別名稱
     * @returns {string} 選項 HTML
     */
    function renderDeptOptionsHtml(depts, selectedDepartment) {
      let optionsHtml = '<option value="">所有科別</option>';
      if (!depts) {
        return optionsHtml;
      }
      const names = [];
      const seen = Object.create(null);
      for (const code in depts) {
        const name = depts[code];
        if (name && !seen[name]) {
          seen[name] = true;
          names.push(name);
        }
      }
      const comparator =
        options.compareDepartmentsByCode ||
        (MEA.courseData && typeof MEA.courseData.compareDepartmentsByCode === "function"
          ? MEA.courseData.compareDepartmentsByCode
          : function (a, b) {
              return String(a).localeCompare(String(b), "zh-TW");
            });
      names.sort(comparator);
      for (let i = 0; i < names.length; i++) {
        const name = names[i];
        const selected = selectedDepartment === name ? " selected" : "";
        optionsHtml +=
          '<option value="' + safeEscapeHtml(name) + '"' + selected + ">" + safeEscapeHtml(name) + "</option>";
      }
      return optionsHtml;

              emptyHtml: renderEmptyCoursesStateHtml(courses),
              colspan: 10,
              pagination: {

          : '<div class="table-responsive mt-3">' +
            '  <table class="table">' +
            "    <thead>" +
            "      <tr>" +
            '        <th scope="col">學年</th><th scope="col">學期</th><th scope="col">年級</th><th scope="col">課程代碼</th><th scope="col">科目名稱</th><th scope="col">科別</th><th scope="col">課程類別</th><th scope="col">科目屬性</th><th scope="col">必選修</th><th scope="col">學分/時數</th>' +
            "      </tr>" +
            "    </thead>" +
            "    <tbody>" +
            renderCourseRowsHtml(list, loading, courses) +
            "</tbody>" +
            "  </table>" +
            "</div>";

      return (
        '<div class="panel">' +
        '<div class="panel-header">' +
        "  <div>" +
        '    <h2 class="panel-title">正規化課程代碼清單</h2>' +
        '    <p class="panel-sub">檢視自 39 欄課綱寬表展開後之 1NF 課程紀錄</p>' +
        "  </div>" +
        '  <button type="button" class="btn secondary compact" data-course-action="refresh" data-page="' +
        currentPage +
        '">🔄 重新整理</button>' +
        "</div>" +
        renderSearchFormHtml(courses, deptOptionsHtml) +
        pagedTableHtml +
        "</div>"
      );
    }

    return {
      fetchList: fetchList,
      fetchStats: fetchStats,
      handleSearch: handleSearch,
      resetSearch: resetSearch,
      renderEmptyCoursesStateHtml: renderEmptyCoursesStateHtml,
      renderView: renderView
    };
  }

  return {
    createCoursesModule: createCoursesModule,
    renderEmptyCoursesStateHtml: function (courses) {
      const mod = createCoursesModule({ exposeInternals: true });
      return mod.renderEmptyCoursesStateHtml(courses);
    }
  };
});
