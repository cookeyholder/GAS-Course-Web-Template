   * @param {string} kind - 正規化後種類
   * @returns {string} 圖示文字
   */
  function resolveToastIcon(kind) {
    return kind === "ok" ? "✓" : kind === "err" ? "✕" : kind === "warn" ? "⚠" : "ℹ";
  }

  /**
   * 取得 Toast 停留時間。
   *
   * @param {string} kind - 正規化後種類
   * @param {*} duration - 可覆寫的毫秒數
   * @returns {number} 停留毫秒數
   */
  function resolveToastDuration(kind, duration) {
    if (typeof duration === "number") return duration;
    return kind === "err" ? 5000 : 3500;
  }

  /**
   * 取得 Toast 的無障礙角色；錯誤與警告使用 alert 以即時宣告。
   *
   * @param {string} kind - 正規化後種類
   * @returns {string|null} 角色名稱或 null
   */
  function resolveToastRole(kind) {
    return kind === "err" || kind === "warn" ? "alert" : null;
  }

  /**
   * 建立 Toast 元素。
   *
   * @param {Object} doc - document 依賴
   * @param {string} message - 訊息內容
   * @param {string} kind - 正規化後種類
   * @returns {Object} Toast 元素
   */
  function createToastElement(doc, message, kind) {
    const t = doc.createElement("div");
    t.className = "toast " + kind;

    const role = resolveToastRole(kind);
    if (role && typeof t.setAttribute === "function") t.setAttribute("role", role);

    const iconSpan = doc.createElement("span");
    iconSpan.className = "toast-icon";
    iconSpan.textContent = resolveToastIcon(kind);

    const textSpan = doc.createElement("span");
    textSpan.className = "toast-msg";
    textSpan.textContent = message;

    t.appendChild(iconSpan);
    t.appendChild(textSpan);
    return t;
  }

  /**
   * 安排 Toast 出現與消失計時。
   *
   * @param {Object} t - Toast 元素
   * @param {number} time - 停留毫秒數
   * @param {Function} setTimeoutFn - 計時函式
   */
  function scheduleToastRemoval(t, time, setTimeoutFn) {
    setTimeoutFn(function () {
      t.classList.remove("visible");
      setTimeoutFn(function () {
        if (t.parentNode) t.parentNode.removeChild(t);
      }, 300);
    }, time);
  }

  /**
   * 建立可注入依賴的 UI 模組實例。
   *
   * @param {Object} deps - MEA、window、document 與計時器依賴
   * @returns {Object} MEA.ui 公開方法與測試用內部函式
   */
  function createUiModule(deps) {
    const options = deps || {};
    const MEA = options.MEA || (typeof window !== "undefined" ? window.MEA : null) || {};
    const win = options.window || (typeof window !== "undefined" ? window : null) || {};
    const doc = options.document || (win && win.document) || (typeof document !== "undefined" ? document : null);
    const setTimeoutFn =
      typeof options.setTimeoutFn === "function"
        ? options.setTimeoutFn
        : function (fn, ms) {
            return setTimeout(fn, ms);
          };

    let modalRestoreFocus = null;

    function applyTheme(theme) {
      const value = theme === "dark" ? "dark" : "light";
      doc.documentElement.dataset.theme = value;
      try {
        win.localStorage.setItem(MEA.config.themeKey, value);
      } catch (error) {}
      return value;
    }

    function currentTheme() {
      return doc.documentElement.dataset.theme === "dark" ? "dark" : "light";
    }

    function updateThemeToggleLabels(next) {
      const btn = doc.getElementById("themeToggle");
      if (btn) btn.textContent = next === "dark" ? "◑ 淺色模式" : "◐ 深色模式";
      const loginToggle = doc.getElementById("loginThemeToggle");
      if (loginToggle) loginToggle.textContent = next === "dark" ? "◑ 淺色" : "◐ 深色";
    }

    function toggleTheme() {
      const next = currentTheme() === "dark" ? "light" : "dark";
      applyTheme(next);
      updateThemeToggleLabels(next);
    }

    function getStyleList() {
      return (MEA.config.styles || []).slice();
    }

    function currentStyle() {
      return doc.documentElement.dataset.style || MEA.config.defaultStyle || DEFAULT_STYLE;
    }

    function applyStyle(styleId) {
      const list = getStyleList();
      let valid = false;
      for (let i = 0; i < list.length; i++) {
        if (list[i].id === styleId) {
          valid = true;
          break;
        }
      }
      const target = valid ? styleId : MEA.config.defaultStyle || DEFAULT_STYLE;
      doc.documentElement.dataset.style = target;
      try {
        win.localStorage.setItem(MEA.config.styleKey, target);
      } catch (error) {}
      return target;
    }

    function initThemeAndStyle() {
      let savedTheme = "light";
      let savedStyle = MEA.config.defaultStyle || DEFAULT_STYLE;
      try {
        savedTheme = win.localStorage.getItem(MEA.config.themeKey) || "light";
        savedStyle = win.localStorage.getItem(MEA.config.styleKey) || savedStyle;
      } catch (e) {}
      applyTheme(savedTheme);
      applyStyle(savedStyle);
    }

    function toast(message, type, duration) {
      const host = doc.getElementById("toastHost");
      if (!host) return;

      const kind = resolveToastKind(type);
      const t = createToastElement(doc, message, kind);
      host.appendChild(t);

      setTimeoutFn(function () {
        t.classList.add("visible");
      }, 10);

      scheduleToastRemoval(t, resolveToastDuration(kind, duration), setTimeoutFn);
    }

    /**
     * 收集容器內可聚焦元素，供初始焦點與 Tab 焦點陷阱使用。
     *
     * @param {Object} root - 查詢根元素
     * @returns {Array} 可聚焦元素清單
     */
    function collectFocusableElements(root) {
      if (!root || typeof root.querySelectorAll !== "function") return [];
      const found = root.querySelectorAll("button, input, select, textarea, a[href], [tabindex]");
      const nodes = [];
      for (let i = 0; i < found.length; i++) {
        const node = found[i];
        const tabIndex = typeof node.getAttribute === "function" ? node.getAttribute("tabindex") : null;
        if (node.disabled === true || tabIndex === "-1") continue;
        nodes.push(node);
      }
      return nodes;
    }

    function modal(title, contentHtml, buttons) {
      const host = doc.getElementById("modalHost");
      if (!host) return;

      const previousFocus = doc.activeElement || null;
      host.innerHTML = "";
      const overlay = doc.createElement("div");
      overlay.className = "modal-overlay";
      if (typeof overlay.setAttribute === "function") {
        overlay.setAttribute("role", "dialog");
        overlay.setAttribute("aria-modal", "true");
        overlay.setAttribute("aria-labelledby", MODAL_TITLE_ID);
      }

      const card = doc.createElement("div");
      card.className = "modal-card";

      const head = doc.createElement("div");
      head.className = "modal-header";
      head.innerHTML =
        '<h3 class="modal-title" id="' +
        MODAL_TITLE_ID +
        '">' +
        escapeHtml(title) +
        '</h3><button type="button" class="modal-close" id="modalCloseBtn" aria-label="關閉對話框">✕</button>';

      const body = doc.createElement("div");
      body.className = "modal-body";
      body.innerHTML = contentHtml;

      const foot = doc.createElement("div");
      foot.className = "modal-footer";

      const footButtons = [];
      const btns = buttons || [{ text: "關閉", primary: true, onClick: closeModal }];
      btns.forEach(function (btn) {
        const b = doc.createElement("button");
        b.className = "btn " + (btn.primary ? "primary" : "secondary");
        if (typeof b.setAttribute === "function") b.setAttribute("type", "button");
        b.textContent = btn.text;
        b.onclick = function () {
          if (typeof btn.onClick === "function") {
            btn.onClick();
          } else {
            closeModal();
          }
        };
        foot.appendChild(b);
        footButtons.push(b);
      });

      card.appendChild(head);
      card.appendChild(body);
      card.appendChild(foot);
      overlay.appendChild(card);
      host.appendChild(overlay);

      modalRestoreFocus = previousFocus;

      const closeBtn = doc.getElementById("modalCloseBtn");
      if (closeBtn) closeBtn.onclick = closeModal;
      overlay.onclick = function (e) {
        if (e.target === overlay) closeModal();
      };

      function collectFocusables() {
        const closeNodes = closeBtn ? [closeBtn] : [];
        return closeNodes.concat(collectFocusableElements(body), footButtons);
      }

      const focusables = collectFocusables();
      if (focusables.length > 0 && typeof focusables[0].focus === "function") {
        focusables[0].focus();
      }

      overlay.onkeydown = function (e) {
        if (!e) return;
        const key = e.key || "";
        if (key === "Escape" || key === "Esc" || e.keyCode === 27) {
          if (typeof e.preventDefault === "function") e.preventDefault();
          closeModal();
          return;
        }
        if (key !== "Tab" && e.keyCode !== 9) return;
        const nodes = collectFocusables();
        if (nodes.length === 0) return;
        const index = nodes.indexOf(doc.activeElement);
        if (e.shiftKey) {
          if (index <= 0) {
            if (typeof e.preventDefault === "function") e.preventDefault();
            nodes[nodes.length - 1].focus();
          }
        } else if (index === -1 || index === nodes.length - 1) {
          if (typeof e.preventDefault === "function") e.preventDefault();
          nodes[0].focus();
        }
      };
    }

    function closeModal() {
      const host = doc.getElementById("modalHost");
      if (host) host.innerHTML = "";
      const restoreTarget = modalRestoreFocus;
      modalRestoreFocus = null;
      if (restoreTarget && typeof restoreTarget.focus === "function") restoreTarget.focus();
    }

    function renderUserPill(user) {
      return (
        '  <div class="user-pill">' +
        '    <span class="user-avatar">👤</span>' +
        '    <span class="user-name">' +
        escapeHtml(user.name || user.email) +
        "</span>" +
        '    <span class="pill ' +
        (user.role === "admin" ? "accent" : "muted") +
        '">' +
        escapeHtml(user.roleName || roleName(user.role, MEA.config)) +
        "</span>" +
        "  </div>"
      );
    }

    function renderHeader() {
      const user = MEA.state.user || {};
      const logoutBusy = !!(MEA.state && MEA.state.logoutBusy);
      const styles = getStyleList();
      const curStyle = currentStyle();
      const systemName = (MEA.state.publicConfig && MEA.state.publicConfig.systemName) || MEA.config.title;

      return (
        '<header class="app-header">' +
        '<div class="header-brand">' +
        '  <div class="brand-mark">📋</div>' +
        '  <div class="brand-text">' +
        '    <h1 class="brand-title">' +
        escapeHtml(systemName) +
        "</h1>" +
        '    <span class="brand-sub">Google Apps Script Web App Template v' +
        escapeHtml(MEA.config.version) +
        "</span>" +
        "  </div>" +
        "</div>" +
        '<div class="header-tools">' +
        renderUserPill(user) +
        '  <div class="style-selector-wrap">' +
        '    <label class="sr-only" for="styleSelect">介面風格</label>' +
        '    <select id="styleSelect" class="select compact" onchange="MEA.ui.applyStyle(this.value)">' +
        renderStyleOptions(styles, curStyle) +
        "    </select>" +
        "  </div>" +
        '  <button type="button" id="themeToggle" class="btn secondary compact" onclick="MEA.ui.toggleTheme()">' +
        (currentTheme() === "dark" ? "◑ 淺色模式" : "◐ 深色模式") +
        "  </button>" +
        '  <button type="button" class="btn secondary compact" onclick="MEA.auth.logout()"' +
        (logoutBusy ? " disabled" : "") +
        ">" +
        (logoutBusy ? "登出中..." : "登出") +
        "</button>" +
        "</div>" +
        "</header>"
      );
    }

    function renderNavbar() {
      const tabs = MEA.config.tabs || [];
      const currentTab = MEA.state.tab || "overview";

      let tabsHtml = "";
      for (let i = 0; i < tabs.length; i++) {
        const t = tabs[i];
        const active = t.id === currentTab ? " active" : "";
        tabsHtml +=
          '<button type="button" class="nav-tab' +
          active +
          '" onclick="MEA.setTab(\'' +
          t.id +
          "')\">" +
          '<span class="nav-icon">' +
          t.icon +
          "</span>" +
          '<span class="nav-name">' +
          escapeHtml(t.name) +
          "</span>" +
          "</button>";
      }

      return '<nav class="app-nav">' + '<div class="nav-tabs-container">' + tabsHtml + "</div>" + "</nav>";
    }

    function renderLoginErrorHtml(loginError) {
      if (!loginError) return "";
      return (
        '<div class="login-alert err"><span class="alert-icon">⚠</span><span>' +
        escapeHtml(loginError) +
        "</span></div>"
      );
    }

    function getLoginStatusHtml(isMock, config, auth) {
      if (isMock) {
        return '<div class="login-hint">目前為本機 Mock 模式，可直接使用測試身分登入。</div>';
      }
      if (auth && typeof auth.isGasHosted === "function" && auth.isGasHosted()) {
        const activeEmail = String(config.activeEmail || "").trim();
        return activeEmail
          ? '<div class="login-hint">目前瀏覽器 Google 帳號：<strong>' + escapeHtml(activeEmail) + "</strong></div>"
          : '<div class="login-hint">將透過 Google 帳戶選擇器以目前瀏覽器 Google 帳號登入。</div>';
      }
      if (config.clientId) {
        return '<div class="login-hint">使用 Google Identity Services 憑證進行登入驗證。</div>';
      }
      return '<div class="login-hint">尚未設定 OAuth Client ID；可請管理員於系統設定完成後再啟用 GIS 登入。</div>';
    }

    function renderLoginActions(isMock, loginBusy) {
      const mockHtml = isMock
        ? '<div class="login-divider"><span>或</span></div>' +
          '<button type="button" class="btn secondary block" onclick="MEA.auth.loginMock()"' +
          (loginBusy ? " disabled" : "") +
          ">" +
          "  🧪 本地測試身分登入 (Mock Mode)" +
          "</button>"
        : "";

      return (
        '  <div class="login-actions">' +
        '    <div class="gis-button-wrapper">' +
        '      <div id="googleLoginButton" class="google-btn-host"></div>' +
        "    </div>" +
        mockHtml +
        "  </div>"
      );
    }

    function renderLoginView() {
      const isMock = MEA.config.mock;
      const loginError = MEA.state.loginError || "";
      const loginBusy = MEA.state.loginBusy || false;
      const config = MEA.state.publicConfig || {};
      const styles = getStyleList();
      const curStyle = currentStyle();
      const styleOptionsHtml = renderStyleOptions(styles, curStyle);
      const errorHtml = renderLoginErrorHtml(loginError);
      const statusHtml = getLoginStatusHtml(isMock, config, MEA.auth);

      return (
        '<div class="login-container">' +
        '<div class="login-header-tools">' +
        '  <label class="sr-only" for="loginStyleSelect">介面風格</label>' +
        '  <select id="loginStyleSelect" class="select compact" onchange="MEA.ui.applyStyle(this.value)">' +
        styleOptionsHtml +
        "  </select>" +
        '  <button type="button" id="loginThemeToggle" class="btn secondary compact" onclick="MEA.ui.toggleTheme()">' +
        (currentTheme() === "dark" ? "◑ 淺色" : "◐ 深色") +
        "  </button>" +
        "</div>" +
        '<div class="login-card">' +
        '  <div class="login-brand">' +
        '    <div class="login-logo">✨</div>' +
        '    <h2 class="login-title">' +
        escapeHtml(config.systemName || MEA.config.title) +
        "</h2>" +
        '    <p class="login-desc">Google 帳號登入、Session 安全控管與 108 課綱課程代碼 1NF 正規化範本</p>' +
        "  </div>" +
        errorHtml +
        statusHtml +
        renderLoginActions(isMock, loginBusy) +
        '  <div class="login-footer">' +
        '    <p class="login-note">首次登入且尚無白名單資料時，系統將自動建立第一位系統管理員。</p>' +
        "  </div>" +
        "</div>" +
        "</div>"
      );
    }

    function getLoginMode(config, auth) {
      const isGasHosted = auth && typeof auth.isGasHosted === "function" && auth.isGasHosted();
      if (isGasHosted) return "GAS ActiveUser / AccountChooser";
      if (config.clientId) return "Google Identity Services";
      return "未設定 Client ID";
    }

    function renderOverviewMetrics(config, user, courses, loginMode) {
      return (
        '<div class="metrics-grid">' +
        '  <div class="metric-card">' +
        '    <div class="metric-label">目前學年度 / 學期</div>' +
        '    <div class="metric-value">' +
        escapeHtml(config.schoolYear || "114") +
        " - " +
        escapeHtml(config.semester || "1") +
        "</div>" +
        '    <div class="metric-sub">系統作業環境</div>' +
        "  </div>" +
        '  <div class="metric-card">' +
        '    <div class="metric-label">已登入使用者</div>' +
        '    <div class="metric-value">' +
        escapeHtml(user.name || user.email) +
        "</div>" +
        '    <div class="metric-sub">角色權限：' +
        escapeHtml(user.roleName || user.role) +
        "</div>" +
        "  </div>" +
        '  <div class="metric-card">' +
        '    <div class="metric-label">登入機制</div>' +
        '    <div class="metric-value">' +
        escapeHtml(loginMode) +
        "</div>" +
        '    <div class="metric-sub">' +
        (config.allowedDomain ? "限制網域：@" + escapeHtml(config.allowedDomain) : "未限制登入網域") +
        "</div>" +
        "  </div>" +
        '  <div class="metric-card">' +
        '    <div class="metric-label">課程索引筆數</div>' +
        '    <div class="metric-value">' +
        number(courses.total || 0) +
        "</div>" +
        '    <div class="metric-sub">正規化課程紀錄總數</div>' +
        "  </div>" +
        "</div>"
      );
    }

    function renderFeatureGrid() {
      return (
        '<div class="card mt-4">' +
        '  <h3 class="card-title">🚀 範本功能快速導覽</h3>' +
        '  <div class="feature-grid mt-3">' +
        '    <div class="feature-item" onclick="MEA.setTab(\'import\')">' +
        '      <div class="feature-icon">📥</div>' +
        '      <div class="feature-text">' +
        "        <h4>課程代碼匯入與 1NF 正規化</h4>" +
        "        <p>支援 39 欄課綱寬表 Excel 檔案上傳，全數匯入並展開為 14 欄標準 1NF 課程索引。</p>" +
        "      </div>" +
        "    </div>" +
        '    <div class="feature-item" onclick="MEA.setTab(\'courses\')">' +
        '      <div class="feature-icon">📚</div>' +
        '      <div class="feature-text">' +
        "        <h4>正規化課程檢索與分頁</h4>" +
        "        <p>提供多維度關鍵字、學年、學期、科別篩選機制，支援大批量課程資料快速檢索。</p>" +
        "      </div>" +
        "    </div>" +
        '    <div class="feature-item" onclick="MEA.setTab(\'settings\')">' +
        '      <div class="feature-icon">⚙️</div>' +
        '      <div class="feature-text">' +
        "        <h4>系統設定與授權管理 (RBAC)</h4>" +
        "        <p>維護 Google OAuth 設定、登入網域限制、學期參數與系統存取授權白名單。</p>" +
        "      </div>" +
        "    </div>" +
        "  </div>" +
        "</div>"
      );
    }

    function renderOverviewView() {
      const config = MEA.state.publicConfig || {};
      const user = MEA.state.user || {};
      const courses = MEA.state.courses || {};
      const loginMode = getLoginMode(config, MEA.auth);

      return (
        '<div class="panel overview-panel">' +
        '<div class="panel-header">' +
        "  <div>" +
        '    <h2 class="panel-title">系統概覽儀表板</h2>' +
        '    <p class="panel-sub">Google Apps Script 網頁應用程式範本核心運作狀態</p>' +
        "  </div>" +
        "</div>" +
        renderOverviewMetrics(config, user, courses, loginMode) +
        renderFeatureGrid() +
        "</div>"
      );
    }

    /**
     * 函數防抖 (Debounce)
     *
     * @param {Function} fn - 目標執行函數
     * @param {number} [delay=250] - 延遲毫秒數
     * @returns {Function} 防抖包裹後之函數
     */
    function debounce(fn, delay) {
      let timer = null;
      const wait = typeof delay === "number" ? delay : 250;
      return function () {
        const context = this;
        const args = arguments;
        if (timer) {
          clearTimeout(timer);
        }
        timer = setTimeoutFn(function () {
          fn.apply(context, args);
        }, wait);
      };
    }

    const api = {
      escapeHtml: escapeHtml,
      number: number,
      roleName: function (role) {
        return roleName(role, MEA.config);
      },
      debounce: debounce,
      applyTheme: applyTheme,
      currentTheme: currentTheme,
      toggleTheme: toggleTheme,
      getStyleList: getStyleList,
      currentStyle: currentStyle,
      applyStyle: applyStyle,
      initThemeAndStyle: initThemeAndStyle,
      toast: toast,
      modal: modal,
      closeModal: closeModal,
      renderHeader: renderHeader,
      renderNavbar: renderNavbar,
      renderLoginView: renderLoginView,
      renderOverviewView: renderOverviewView
    };

    if (options.exposeInternals) {
      Object.assign(api, {
        collectFocusableElements: collectFocusableElements,
        renderStyleOptions: renderStyleOptions,
        resolveToastKind: resolveToastKind,
        resolveToastRole: resolveToastRole,
        resolveToastIcon: resolveToastIcon,
        resolveToastDuration: resolveToastDuration,
        createToastElement: createToastElement,
        scheduleToastRemoval: scheduleToastRemoval,
        renderUserPill: renderUserPill,
        renderLoginErrorHtml: renderLoginErrorHtml,
        getLoginStatusHtml: getLoginStatusHtml,
        renderLoginActions: renderLoginActions,
        getLoginMode: getLoginMode,
        renderOverviewMetrics: renderOverviewMetrics,
        renderFeatureGrid: renderFeatureGrid,
        updateThemeToggleLabels: updateThemeToggleLabels
      });
    }

    return api;
  }

  return {
    createUiModule: createUiModule,
    DEFAULT_STYLE: DEFAULT_STYLE,
    escapeHtml: escapeHtml,
    number: number,
    roleName: roleName,
    renderStyleOptions: renderStyleOptions,
    resolveToastKind: resolveToastKind,
    resolveToastRole: resolveToastRole,
    resolveToastIcon: resolveToastIcon,
    resolveToastDuration: resolveToastDuration,
    createToastElement: createToastElement,
    scheduleToastRemoval: scheduleToastRemoval
  };
});
  </script>
  <script>
/* js/auth.js */
/**
 * @file auth.js
 * @description Google Identity Services (GIS) 登入、GAS 雙軌登入、工作階段還原與登出
 *
 * 採 UMD 工廠模式：Node.js 測試環境可直接匯入純函式與控制器工廠；
 * 瀏覽器環境則由檔案上方組裝邏輯建立 window.MEA.auth，維持既有呼叫契約。
 */
(function (root, factory) {
  "use strict";

  const api = factory();

      if (!entry.importId) {

      }

      MEA.setState({ importBusy: true });

        .call(

        ? renderPreviewCardHtml(entry, busy, canImport, MEA.ui.escapeHtml, MEA.ui.number)
        : buildDropzoneHtml();

    }

      previewFile: previewFile,
      pickFile: pickFile,
      handleDropzoneKey: handleDropzoneKey,
      handleFileSelect: handleFileSelect,
      handleDragOver: handleDragOver,
      handleDragLeave: handleDragLeave,
      handleDrop: handleDrop,

      doImport: doImport,
      renderView: renderView
    };

    if (options.exposeInternals) {
      Object.assign(api, {
        rowsOfSheet: rowsOfSheet,
        readRowsOfSheet: readRowsOfSheet,

    }

    /**
     * 統一錯誤訊息轉譯。
     *
     * @param {*} error - 錯誤物件或字串
     * @param {string} fallback - 原始例外不外顯時使用的文案
     * @returns {string} 可顯示的錯誤訊息
     */
    function normalizeErrorMessage(error, fallback) {
      return resolveSafeMessage(error, fallback);
    }

    /**
     * 由目前的課程狀態與目標頁碼建構 API 查詢參數。
     *
     * @param {Object} cur - 目前課程狀態
     * @param {number} targetPage - 目標頁碼
     * @returns {Object} API payload
     */
    function buildCourseQuery(cur, targetPage) {
      return {
        keyword: cur.keyword || "",
        department: cur.department || "",
        academicYear: cur.academicYear || "",
        semester: cur.semester || "",
        page: targetPage,
        pageSize: cur.pageSize || 30
      };
    }

    /**
     * 由查詢參數建立 in-flight Promise 避免重複鍵。
     *
     * @param {Object} query - API 查詢參數
     * @returns {string} 避免重複鍵
     */
    function buildCourseFetchKey(query) {
      return JSON.stringify([
        query.keyword || "",
        query.department || "",
        query.academicYear || "",
        query.semester || "",
        query.page || 1,
        query.pageSize || 30
      ]);
    }

    /**
     * 由成功回應建構課程狀態更新片段。
     *
     * @param {number} targetPage - 目標頁碼
     * @param {Object} result - API 回應
     * @returns {Object} courses 更新片段
     */
    function buildCoursesSuccessPatch(targetPage, result) {
      return {
        loading: false,
        list: result.list || [],
        total: result.total || 0,
        page: result.page || targetPage,
        pageSize: result.pageSize || 30,
        totalPages: result.totalPages || 1
      };
    }

    /**
     * 處理課程清單讀取結果（原 fetchList 的 then 回呼）。
     *
     * @param {Object} cur - 請求前的課程狀態快照
     * @param {Object} result - API 回應
     * @param {number} targetPage - 目標頁碼
     */
    function handleFetchListSuccess(cur, result, targetPage) {
      if (!result || result.ok !== true) {
        MEA.setState({
          courses: Object.assign({}, cur, { loading: false })
        });
        MEA.ui.toast((result && result.message) || "讀取課程資料失敗", "err");
        return;
      }

      MEA.setState({
        courses: Object.assign({}, cur, buildCoursesSuccessPatch(targetPage, result))
      });
    }

    const inflightListFetches = {};
    let listRequestSeq = 0;

    /** 只接受最新一次清單請求的回應，避免過期回應覆蓋新篩選結果。 */
    function isCurrentListRequest(seq) {
      return seq === listRequestSeq;
    }

    function fetchList(page) {
      const targetPage = page || (MEA.state.courses && MEA.state.courses.page) || 1;
      const cur = MEA.state.courses || {};
      const query = buildCourseQuery(cur, targetPage);
      const fetchKey = buildCourseFetchKey(query);
      if (Object.prototype.hasOwnProperty.call(inflightListFetches, fetchKey)) {
        return inflightListFetches[fetchKey];
      }

      const requestSeq = ++listRequestSeq;
      MEA.setState({
        courses: Object.assign({}, cur, { loading: true, page: targetPage })
      });

      const pending = MEA.api
        .call("getCourseIndex", query)
        .then(function (result) {
          if (!isCurrentListRequest(requestSeq)) return;
          handleFetchListSuccess(cur, result, targetPage);
        })
        .catch(function (error) {
          if (!isCurrentListRequest(requestSeq)) return;
          MEA.setState({
            courses: Object.assign({}, cur, { loading: false })
          });
          MEA.ui.toast(normalizeErrorMessage(error, "讀取課程資料失敗，請稍後再試"), "err");
        });

      const tracked = pending.then(
        function (value) {
          delete inflightListFetches[fetchKey];
          return value;
        },
        function (error) {
          delete inflightListFetches[fetchKey];
          throw error;
        }
      );
      inflightListFetches[fetchKey] = tracked;
      return tracked;
    }

    /**
     * 處理輕量統計回應：僅更新概覽頁所需的總筆數。
     *
     * @param {Object} result - API 回應
     */
    function handleFetchStatsSuccess(result) {
      if (!result || result.ok !== true) return;
      const cur = MEA.state.courses || {};
      MEA.setState({
        courses: Object.assign({}, cur, { total: result.total || 0 })
      });
    }

    /**
     * 僅取得課程索引總筆數，不下載完整清單；供概覽頁使用。
     *
     * @returns {Promise<Object|null>} API 回應或失敗時的 null
     */
    function fetchStats() {
      if (!MEA.api || typeof MEA.api.call !== "function") return Promise.resolve(null);
      return MEA.api
        .call("getCourseIndexStats", {})
        .then(function (result) {
          handleFetchStatsSuccess(result);
          return result;
        })
        .catch(function () {
          return null;
        });
    }

    /**
     * 讀取搜尋表單欄位。
     *
     * @returns {Object} 表單值快照
     */
    function readSearchFormValues() {
      const keywordInput = getElementById("courseSearchKeyword");
      const deptSelect = getElementById("courseSearchDept");
      const yearInput = getElementById("courseSearchYear");
      const semSelect = getElementById("courseSearchSem");

      return {
        keyword: keywordInput ? keywordInput.value.trim() : "",
        department: deptSelect ? deptSelect.value.trim() : "",
        academicYear: yearInput ? yearInput.value.trim() : "",
        semester: semSelect ? semSelect.value.trim() : ""
      };
    }

    function handleSearch(e) {
      if (e && e.preventDefault) e.preventDefault();
      const cur = MEA.state.courses || {};
      MEA.setState({
        courses: Object.assign({}, cur, readSearchFormValues())
      });

      fetchList(1);
    }

    function resetSearch() {
      const cur = MEA.state.courses || {};
      MEA.setState({
        courses: Object.assign({}, cur, {
          keyword: "",
          department: "",
          academicYear: "",
          semester: ""
        })
      });
      fetchList(1);
    }

    /**
     * 產生科別下拉選單。
     *
     * @param {Object} depts - 科別對照字典
     * @param {string} selectedDepartment - 目前選中的科別名稱
     * @returns {string} HTML 字串
     */
    function renderDeptOptionsHtml(depts, selectedDepartment) {
      let optionsHtml = '<option value="">所有科別</option>';
      for (const code in depts) {
        const name = depts[code];
        const selected = selectedDepartment === name ? " selected" : "";
        optionsHtml +=
          '<option value="' + MEA.ui.escapeHtml(name) + '"' + selected + ">" + MEA.ui.escapeHtml(name) + "</option>";
      }
      return optionsHtml;
    }

    /**
     * 產生單筆課程表格列。
     *
     * @param {Object} item - 課程紀錄
     * @returns {string} HTML 字串
     */
    function renderCourseRowHtml(item) {
      return (
        "<tr>" +
        "<td>" +
        MEA.ui.escapeHtml(item.academicYear) +
        "</td>" +
        "<td>" +
        MEA.ui.escapeHtml(item.semester) +
        "</td>" +
        "<td>" +
        MEA.ui.escapeHtml(item.grade) +
        "</td>" +
        '<td class="mono font-sm">' +
        MEA.ui.escapeHtml(item.courseCode) +
        "</td>" +
        "<td><strong>" +
        MEA.ui.escapeHtml(item.subjectName) +
        "</strong></td>" +
        '<td><span class="pill muted">' +
        MEA.ui.escapeHtml(item.department) +
        "</span></td>" +
        "<td>" +
        MEA.ui.escapeHtml(item.subjectType) +
        "</td>" +
        "<td>" +
        MEA.ui.escapeHtml(item.attribute) +
        "</td>" +
        "<td>" +
        MEA.ui.escapeHtml(item.required) +
        "</td>" +
        "<td>" +
        MEA.ui.escapeHtml(item.credits) +
        " / " +
        MEA.ui.escapeHtml(item.hours) +
        "</td>" +
        "</tr>"
      );
    }

    /**
     * 產生課程表格內容。
     *
     * @param {Array<Object>} list - 課程陣列
     * @param {boolean} loading - 是否載入中
     * @returns {string} HTML 字串
     */
    function renderCourseRowsHtml(list, loading) {
      if (loading) {
        return '<tr><td colspan="10" class="text-center py-8 text-muted">正在載入課程資料...</td></tr>';
      }
      if (list.length === 0) {
        return (
          '<tr><td colspan="10" class="text-center py-8 text-muted">' +
          "目前尚無符合的課程紀錄，請至「課程代碼匯入」上傳資料或調整篩選條件。" +
          "</td></tr>"
        );
      }

      let rowsHtml = "";
      for (let i = 0; i < list.length; i++) {
        rowsHtml += renderCourseRowHtml(list[i]);
      }
      return rowsHtml;
    }

    /**
     * 產生分頁列。
     *
     * @param {Object} courses - 課程狀態
     * @param {boolean} loading - 是否載入中
     * @returns {string} HTML 字串
     */
    function renderPaginationHtml(courses, loading) {
      const totalPages = courses.totalPages || 1;
      const currentPage = courses.page || 1;
      return (
        '<div class="pagination-bar">' +
        '  <span class="pagination-info">共 ' +
        MEA.ui.number(courses.total) +
        " 筆紀錄 · 第 " +
        currentPage +
        " / " +
        totalPages +
        " 頁</span>" +
        '  <div class="pagination-buttons">' +
        '    <button type="button" class="btn secondary compact" onclick="MEA.courses.fetchList(' +
        (currentPage - 1) +
        ')"' +
        (currentPage <= 1 || loading ? " disabled" : "") +
        ">上一頁</button>" +
        '    <button type="button" class="btn secondary compact" onclick="MEA.courses.fetchList(' +
        (currentPage + 1) +
        ')"' +
        (currentPage >= totalPages || loading ? " disabled" : "") +
        ">下一頁</button>" +
        "  </div>" +
        "</div>"
      );
    }

    /**
     * 產生搜尋表單。
     *
     * @param {Object} courses - 課程狀態
     * @param {string} deptOptionsHtml - 科別下拉選單 HTML
     * @returns {string} HTML 字串
     */
    function renderSearchFormHtml(courses, deptOptionsHtml) {
      return (
        '<div class="filter-bar">' +
        '  <form class="filter-form" onsubmit="MEA.courses.handleSearch(event)">' +
        '    <label class="sr-only" for="courseSearchKeyword">搜尋關鍵字</label>' +
        '    <input type="text" id="courseSearchKeyword" class="input" placeholder="搜尋課程代碼、科目名稱或群別..." value="' +
        MEA.ui.escapeHtml(courses.keyword || "") +
        '" />' +
        '    <label class="sr-only" for="courseSearchDept">科別篩選</label>' +
        '    <select id="courseSearchDept" class="select">' +
        deptOptionsHtml +
        "</select>" +
        '    <label class="sr-only" for="courseSearchYear">開課學年</label>' +
        '    <input type="text" id="courseSearchYear" class="input compact" style="width:100px;" placeholder="學年 (如 114)" value="' +
        MEA.ui.escapeHtml(courses.academicYear || "") +
        '" />' +
        '    <label class="sr-only" for="courseSearchSem">學期篩選</label>' +
        '    <select id="courseSearchSem" class="select compact" style="width:100px;">' +
        '      <option value="">學期</option>' +
        '      <option value="1"' +
        (courses.semester === "1" ? " selected" : "") +
        ">第 1 學期</option>" +
        '      <option value="2"' +
        (courses.semester === "2" ? " selected" : "") +
        ">第 2 學期</option>" +
        "    </select>" +
        '    <button type="submit" class="btn primary">搜尋</button>' +
        '    <button type="button" class="btn secondary" onclick="MEA.courses.resetSearch()">重設</button>' +
        "  </form>" +
        "</div>"
      );
    }

    function renderView() {
      const courses = MEA.state.courses || {};
      const list = courses.list || [];
      const loading = courses.loading;
      const depts = MEA.courseData.DEPARTMENT_CODE_NAMES || {};

      const deptOptionsHtml = renderDeptOptionsHtml(depts, courses.department);
      const rowsHtml = renderCourseRowsHtml(list, loading);
      const paginationHtml = renderPaginationHtml(courses, loading);
      const currentPage = courses.page || 1;

      return (
        '<div class="panel">' +
        '<div class="panel-header">' +
        "  <div>" +
        '    <h2 class="panel-title">正規化課程索引清單</h2>' +
        '    <p class="panel-sub">檢視自 39 欄課綱寬表展開後之 1NF 課程紀錄</p>' +
        "  </div>" +
        '  <button type="button" class="btn secondary compact" onclick="MEA.courses.fetchList(' +
        currentPage +
        ')">🔄 重新整理</button>' +
        "</div>" +
        renderSearchFormHtml(courses, deptOptionsHtml) +
        '<div class="table-responsive mt-3">' +
        '  <table class="table">' +
        "    <thead>" +
        "      <tr>" +
        '        <th scope="col">學年</th><th scope="col">學期</th><th scope="col">年級</th><th scope="col">課程代碼</th><th scope="col">科目名稱</th><th scope="col">科別</th><th scope="col">課程類別</th><th scope="col">科目屬性</th><th scope="col">必選修</th><th scope="col">學分/時數</th>' +
        "      </tr>" +
        "    </thead>" +
        "    <tbody>" +
        rowsHtml +
        "</tbody>" +
        "  </table>" +
        "</div>" +
        paginationHtml +
        "</div>"
      );
    }

    return {
      fetchList: fetchList,
      fetchStats: fetchStats,
      handleSearch: handleSearch,
      resetSearch: resetSearch,
      renderView: renderView
    };
  }

  return {
    createCoursesModule: createCoursesModule
  };
});
  </script>
  <script>
/* js/accounts.js */
/**
 * @file accounts.js
 * @description 系統設定與存取授權白名單（RBAC）管理模組（可測試工廠）。
 *
 * 瀏覽器環境組裝 window.MEA.accounts；Node.js 環境匯出 createAccountsModule 供單元測試注入依賴。
 */
(function (root, factory) {
  "use strict";

  const api = factory();

  if (typeof window !== "undefined") {
    const MEA = (root.MEA = root.MEA || {});
    MEA.accounts = api.createAccountsModule({
      MEA: MEA,
      document: window.document
    });
  }

  if (typeof module !== "undefined" && module.exports) {
    module.exports = api;
  }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const safeErrorsFallback = typeof module !== "undefined" && module.exports ? require("./errorMessages.js") : null;

  function getSafeErrors() {
    const globalNamespace = typeof globalThis !== "undefined" ? globalThis : {};
    return (globalNamespace.MEA && globalNamespace.MEA.safeErrors) || safeErrorsFallback;
  }

  function resolveSafeMessage(value, fallback) {
    const helper = getSafeErrors();
    return helper ? helper.resolveUserMessage(value, fallback) : fallback;
  }

  /**
   * 建立帳號與系統設定模組控制器。
   *
   * @param {Object} [deps] - 依賴注入（MEA、document）
   * @returns {Object} 公開方法集合（與 MEA.accounts 一致）
   */
  function createAccountsModule(deps) {
    const options = deps || {};
    const MEA = options.MEA || (typeof window !== "undefined" ? window.MEA : null) || {};
    const doc = options.document || (typeof document !== "undefined" ? document : null);

    /**
     * 以注入的 document 取得元素，缺損時回傳 null。
     *
     * @param {string} id - 元素識別碼
     * @returns {Object|null} 元素或 null
     */
    function getElementById(id) {
      return doc && typeof doc.getElementById === "function" ? doc.getElementById(id) : null;
    }

    /**
     * 統一錯誤訊息轉譯。
     *
     * @param {*} error - 錯誤物件或字串
     * @param {string} fallback - 原始例外不外顯時使用的文案
     * @returns {string} 可顯示的錯誤訊息
     */
    function normalizeErrorMessage(error, fallback) {
      return resolveSafeMessage(error, fallback);
    }

    function loadSettingsAndAccounts() {
      MEA.setState({
        settings: Object.assign({}, MEA.state.settings || {}, { loading: true })
      });

      Promise.all([MEA.api.call("getSystemSettings", {}), MEA.api.call("getAccounts", {})])
        .then(function (results) {
          const settingsRes = results[0];
          const accountsRes = results[1];

          MEA.setState({
            settings: {
              loading: false,
              saving: false,
              data: settingsRes && settingsRes.settings ? settingsRes.settings : {},
              accounts: accountsRes && accountsRes.accounts ? accountsRes.accounts : []
            }
          });
        })
        .catch(function (error) {
          MEA.setState({
            settings: Object.assign({}, MEA.state.settings || {}, { loading: false })
          });
          MEA.ui.toast(normalizeErrorMessage(error, "讀取系統設定失敗，請稍後再試"), "err");
        });
    }

    /**
     * 讀取系統設定表單欄位。
     *
     * @returns {Object} 表單值快照
     */
    function collectSettingsFormValues() {
      const systemNameInput = getElementById("cfgSystemName");
      const schoolYearInput = getElementById("cfgSchoolYear");
      const semesterInput = getElementById("cfgSemester");
      const clientIdInput = getElementById("cfgClientId");
      const clientSecretInput = getElementById("cfgClientSecret");
      const allowedDomainInput = getElementById("cfgAllowedDomain");
      const restrictInput = getElementById("cfgRestrictWhitelist");

      return {
        systemName: systemNameInput ? systemNameInput.value.trim() : "",
        schoolYear: schoolYearInput ? schoolYearInput.value.trim() : "",
        semester: semesterInput ? semesterInput.value.trim() : "",
        clientId: clientIdInput ? clientIdInput.value.trim() : "",
        clientSecret: clientSecretInput ? clientSecretInput.value.trim() : "",
        allowedLoginDomain: allowedDomainInput ? allowedDomainInput.value.trim().replace(/^@/, "").toLowerCase() : "",
        restrict: !!(restrictInput && restrictInput.checked)
      };
    }

    /**
     * 由表單值建構後端儲存參數。
     *
     * @param {Object} values - 表單值快照
     * @returns {Object} API payload
     */
    function buildSettingsPayload(values) {
      return {
        settings: {
          systemName: values.systemName,
          schoolYear: values.schoolYear,
          semester: values.semester,
          clientId: values.clientId,
          clientSecret: values.clientSecret,
          allowedLoginDomain: values.allowedLoginDomain,
          restrictWhitelist: values.restrict ? "true" : "false"
        }
      };
    }

    /**
     * 由表單值建構前端公眾設定更新片段。
     *
     * @param {Object} values - 表單值快照
     * @returns {Object} publicConfig 更新片段
     */
    function buildPublicConfigPatch(values) {
      return {
        systemName: values.systemName,
        schoolYear: values.schoolYear,
        semester: values.semester,
        clientId: values.clientId,
        allowedDomain: values.allowedLoginDomain,
        hasClientSecret: Boolean(values.clientSecret)
      };
    }

    /**
     * 結束儲存中狀態。
     */
    function finishSettingsSaving() {
      MEA.setState({
        settings: Object.assign({}, MEA.state.settings || {}, { saving: false })
      });
    }

    /**
     * 處理系統設定儲存結果（原 saveSettings 的 then 回呼）。
     *
     * @param {Object} result - API 回應
     * @param {Object} values - 表單值快照
     */
    function handleSettingsSaveResult(result, values) {
      finishSettingsSaving();
      if (result && result.ok) {
        MEA.ui.toast("系統參數已成功儲存！", "ok");
        if (MEA.state.publicConfig) {
          MEA.setState({
            publicConfig: Object.assign({}, MEA.state.publicConfig, buildPublicConfigPatch(values))
          });
        }
      } else {
        MEA.ui.toast((result && result.message) || "儲存失敗", "err");
      }
    }

    function saveSettings(e) {
      if (e && e.preventDefault) e.preventDefault();
      const values = collectSettingsFormValues();

      MEA.setState({
        settings: Object.assign({}, MEA.state.settings || {}, { saving: true })
      });

      MEA.api
        .call("saveSystemSettings", buildSettingsPayload(values))
        .then(function (result) {
          handleSettingsSaveResult(result, values);
        })
        .catch(function (error) {
          finishSettingsSaving();
          MEA.ui.toast(normalizeErrorMessage(error, "儲存系統設定失敗，請稍後再試"), "err");
        });
    }

    /**
     * 讀取新增授權成員表單欄位。
     *
     * @returns {Object} 表單值快照
     */
    function readNewAccountValues() {
      const emailInput = getElementById("newAccountEmail");
      const nameInput = getElementById("newAccountName");
      const roleSelect = getElementById("newAccountRole");

      return {
        email: emailInput ? emailInput.value.trim().toLowerCase() : "",
        name: nameInput ? nameInput.value.trim() : "",
        role: roleSelect ? roleSelect.value : "viewer"
      };
    }

    /**
     * 檢查 Email 是否已在白名單中。
     *
     * @param {Array<Object>} accounts - 現有帳號陣列
     * @param {string} email - 待檢查 Email
     * @returns {boolean} 是否已存在
     */
    function isDuplicateEmail(accounts, email) {
      for (let i = 0; i < accounts.length; i++) {
        if (accounts[i].email === email) return true;
      }
      return false;
    }

    /**
     * 由表單值產生更新後的帳號陣列。
     *
     * @param {Array<Object>} accounts - 現有帳號陣列
     * @param {Object} values - 表單值快照
     * @returns {Array<Object>} 更新後的帳號陣列
     */
    function buildUpdatedAccounts(accounts, values) {
      return accounts.concat([
        {
          email: values.email,
          name: values.name || values.email,
          role: values.role,
          roleName: MEA.config.roleNames[values.role] || values.role,
          enabled: true
        }
      ]);
    }

    /**
     * 處理「新增」按鈕點擊（原 addAccountPrompt 的 onClick 回呼）。
     */
    function handleAddAccountClick() {
      const values = readNewAccountValues();
      if (!values.email || values.email.indexOf("@") === -1) {
        MEA.ui.toast("請填寫有效的 Email", "warn");
        return;
      }

      const cur = (MEA.state.settings && MEA.state.settings.accounts) || [];
      if (isDuplicateEmail(cur, values.email)) {
        MEA.ui.toast("此 Email 已在白名單中", "warn");
        return;
      }

      saveAccountsList(buildUpdatedAccounts(cur, values));
      MEA.ui.closeModal();
    }

    function addAccountPrompt() {
      const roleNames = (MEA.config && MEA.config.roleNames) || {};
      const escapeHtml =
        MEA.ui && typeof MEA.ui.escapeHtml === "function"
          ? MEA.ui.escapeHtml
          : function (value) {
              return String(value);
            };
      const roleOptions = Object.keys(roleNames)
        .map(function (role) {
          return (
            '<option value="' +
            escapeHtml(role) +
            '">' +
            escapeHtml(roleNames[role]) +
            " (" +
            escapeHtml(role) +
            ")</option>"
          );
        })
        .join("");

      const html =
        '<div class="form-group">' +
        '  <label class="label" for="newAccountEmail">Google Email</label>' +
        '  <input type="email" id="newAccountEmail" class="input" placeholder="user@example.com" />' +
        "</div>" +
        '<div class="form-group mt-2">' +
        '  <label class="label" for="newAccountName">姓名或職稱</label>' +
        '  <input type="text" id="newAccountName" class="input" placeholder="王小明" />' +
        "</div>" +
        '<div class="form-group mt-2">' +
        '  <label class="label" for="newAccountRole">指派角色</label>' +
        '  <select id="newAccountRole" class="select">' +
        roleOptions +
        "  </select>" +
        "</div>";

      MEA.ui.modal("新增授權帳號", html, [
        { text: "取消", secondary: true, onClick: MEA.ui.closeModal },
        {
          text: "新增",
          primary: true,
          onClick: handleAddAccountClick
        }
      ]);
    }

    function removeAccount(email) {
      const cur = (MEA.state.settings && MEA.state.settings.accounts) || [];
      const updated = cur.filter(function (a) {
        return a.email !== email;
      });
      MEA.ui.modal(
        "確認刪除授權成員",
        '<p class="mb-2">確定要刪除 <strong>' +
          MEA.ui.escapeHtml(email) +
          "</strong> 嗎？刪除後該帳號將立即失去存取權。</p>",
        [
          { text: "取消", onClick: MEA.ui.closeModal },
          {
            text: "確認刪除",
            primary: true,
            onClick: function () {
              MEA.ui.closeModal();
              saveAccountsList(updated);
            }
          }
        ]
      );
    }

    function toggleAccount(email) {
      const cur = (MEA.state.settings && MEA.state.settings.accounts) || [];
      const updated = cur.map(function (a) {
        if (a.email === email) {
          return Object.assign({}, a, { enabled: !a.enabled });
        }
        return a;
      });
      saveAccountsList(updated);
    }

    /**
     * 結束白名單儲存中狀態。
     */
    function finishWhitelistSaving() {
      MEA.setState({
        settings: Object.assign({}, MEA.state.settings || {}, { saving: false })
      });
    }

    /**
     * 處理白名單儲存結果（原 saveAccountsList 的 then 回呼）。
     *
     * @param {Object} result - API 回應
     */
    function handleWhitelistSaveResult(result) {
      finishWhitelistSaving();
      if (result && result.ok) {
        MEA.ui.toast("授權白名單已更新！", "ok");
      } else {
        MEA.ui.toast((result && result.message) || "白名單更新失敗", "err");
      }
    }

    function saveAccountsList(accounts) {
      MEA.setState({
        settings: Object.assign({}, MEA.state.settings || {}, {
          saving: true,
          accounts: accounts
        })
      });

      MEA.api
        .call("saveWhitelist", { accounts: accounts })
        .then(function (result) {
          handleWhitelistSaveResult(result);
        })
        .catch(function (error) {
          finishWhitelistSaving();
          MEA.ui.toast(normalizeErrorMessage(error, "儲存授權成員失敗，請稍後再試"), "err");
        });
    }

    /**
     * 產生權限不足面板。
     *
     * @param {Object} user - 目前使用者
     * @returns {string} HTML 字串
     */
    function renderPermissionDeniedHtml(user) {
      return (
        '<div class="panel">' +
        '<div class="panel-header"><h2 class="panel-title">權限不足</h2></div>' +
        '<div class="alert err">您目前的角色（' +
        MEA.ui.escapeHtml(user.roleName || user.role) +
        "）無權限檢視或修改系統設定與授權名單。</div>" +
        "</div>"
      );
    }

    /**
     * 產生單筆授權成員表格列。
     *
     * @param {Object} a - 帳號紀錄
     * @param {boolean} saving - 是否正在儲存
     * @returns {string} HTML 字串
     */
    function renderAccountRowHtml(a, saving) {
      const disabled = saving ? " disabled" : "";
      return (
        "<tr>" +
        "<td><strong>" +
        MEA.ui.escapeHtml(a.email) +
        "</strong></td>" +
        "<td>" +
        MEA.ui.escapeHtml(a.name) +
        "</td>" +
        '<td><span class="pill ' +
        (a.role === "admin" ? "accent" : "muted") +
        '">' +
        MEA.ui.escapeHtml(a.roleName || a.role) +
        "</span></td>" +
        "<td>" +
        '  <span class="badge ' +
        (a.enabled ? "badge-ok" : "badge-err") +
        '">' +
        (a.enabled ? "已啟用" : "已停用") +
        "  </span>" +
        "</td>" +
        "<td>" +
        '  <button type="button" class="btn secondary compact" onclick="MEA.accounts.toggleAccount(decodeURIComponent(\'' +
        encodeURIComponent(a.email) +
        "'))\"" +
        disabled +
        ">" +
        (a.enabled ? "停用" : "啟用") +
        "</button>" +
        '  <button type="button" class="btn danger compact" onclick="MEA.accounts.removeAccount(decodeURIComponent(\'' +
        encodeURIComponent(a.email) +
        "'))\"" +
        disabled +
        ">刪除</button>" +
        "</td>" +
        "</tr>"
      );
    }

    /**
     * 產生授權成員表格內容。
     *
     * @param {Array<Object>} accounts - 帳號陣列
     * @param {boolean} saving - 是否正在儲存
     * @returns {string} HTML 字串
     */
    function renderAccountsRowsHtml(accounts, saving) {
      if (accounts.length === 0) {
        return '<tr><td colspan="5" class="text-center py-4 text-muted">目前尚未設定任何授權帳號。</td></tr>';
      }

      let rowsHtml = "";
      for (let i = 0; i < accounts.length; i++) {
        rowsHtml += renderAccountRowHtml(accounts[i], saving);
      }
      return rowsHtml;
    }

    /**
     * 產生系統核心參數卡片。
     *
     * @param {Object} data - 系統設定資料
     * @param {boolean} saving - 是否儲存中
     * @returns {string} HTML 字串
     */
    function renderSystemCoreCardHtml(data, saving) {
      return (
        '<div class="card mt-3">' +
        '  <h3 class="card-title">系統核心參數</h3>' +
        '  <form class="mt-3" onsubmit="MEA.accounts.saveSettings(event)">' +
        '    <div class="row">' +
        '      <div class="col" style="flex:2;">' +
        '        <label class="label" for="cfgSystemName">系統名稱</label>' +
        '        <input type="text" id="cfgSystemName" class="input" value="' +
        MEA.ui.escapeHtml(data.systemName || "") +
        '" />' +
        "      </div>" +
        '      <div class="col">' +
        '        <label class="label" for="cfgSchoolYear">目前學年度</label>' +
        '        <input type="text" id="cfgSchoolYear" class="input" value="' +
        MEA.ui.escapeHtml(data.schoolYear || "114") +
        '" />' +
        "      </div>" +
        '      <div class="col">' +
        '        <label class="label" for="cfgSemester">目前學期</label>' +
        '        <input type="text" id="cfgSemester" class="input" value="' +
        MEA.ui.escapeHtml(data.semester || "1") +
        '" />' +
        "      </div>" +
        "    </div>" +
        '    <div class="form-group mt-3">' +
        '      <label class="label" for="cfgClientId">Google OAuth 2.0 Client ID (GIS 登入用)</label>' +
        '      <input type="text" id="cfgClientId" class="input mono" placeholder="xxxxxxxxxxxx-xxxxxxxxxxxxxxxx.apps.googleusercontent.com" value="' +
        MEA.ui.escapeHtml(data.clientId || "") +
        '" />' +
        '      <span class="hint">可於 Google Cloud Console 憑證管理中取得；於 GAS 容器內仍可搭配 ActiveUser / AccountChooser 流程使用。</span>' +
        "    </div>" +
        '    <div class="form-group mt-3">' +
        '      <label class="label" for="cfgClientSecret">Google OAuth 2.0 Client Secret（授權碼回呼備援時需要）</label>' +
        '      <input type="password" id="cfgClientSecret" class="input mono" value="' +
        MEA.ui.escapeHtml(data.clientSecret || "") +
        '" />' +
        "    </div>" +
        '    <div class="form-group mt-3">' +
        '      <label class="label" for="cfgAllowedDomain">Google 登入允許網域（選填）</label>' +
        '      <input type="text" id="cfgAllowedDomain" class="input mono" placeholder="example.edu.tw" value="' +
        MEA.ui.escapeHtml(data.allowedLoginDomain || data["Google 登入允許網域"] || "") +
        '" />' +
        '      <span class="hint">填寫網域後僅允許該網域帳號登入（例如 <code>example.edu.tw</code>）。</span>' +
        "    </div>" +
        '    <div class="form-group mt-3">' +
        '      <label class="checkbox-label" for="cfgRestrictWhitelist">' +
        '        <input type="checkbox" id="cfgRestrictWhitelist"' +
        (data.restrictWhitelist ? " checked" : "") +
        " />" +
        "        <span>嚴格啟用白名單限制（未列於下方成員清單之帳號將拒絕登入）</span>" +
        "      </label>" +
        "    </div>" +
        '    <div class="mt-4">' +
        '      <button type="submit" class="btn primary"' +
        (saving ? " disabled" : "") +
        ">" +
        (saving ? "儲存中..." : "儲存系統設定") +
        "</button>" +
        "    </div>" +
        "  </form>" +
        "</div>"
      );
    }

    /**
     * 產生授權白名單卡片。
     *
     * @param {string} accountsRowsHtml - 表格列 HTML
     * @param {boolean} saving - 是否正在儲存
     * @returns {string} HTML 字串
     */
    function renderWhitelistCardHtml(accountsRowsHtml, saving) {
      const loadingHint = saving ? '<span class="hint" role="status">正在更新授權白名單，請稍候...</span>' : "";
      return (
        '<div class="card mt-4">' +
        '  <div class="card-header">' +
        '    <h3 class="card-title">授權白名單成員清單</h3>' +
        '    <button type="button" class="btn secondary compact" onclick="MEA.accounts.addAccountPrompt()"' +
        (saving ? " disabled" : "") +
        ">＋ 新增授權成員</button>" +
        "  </div>" +
        loadingHint +
        '  <div class="table-responsive mt-3">' +
        '    <table class="table">' +
        "      <thead>" +
        "        <tr>" +
        '          <th scope="col">Email</th><th scope="col">姓名/職稱</th><th scope="col">角色</th><th scope="col">狀態</th><th scope="col">操作</th>' +
        "        </tr>" +
        "      </thead>" +
        "      <tbody>" +
        accountsRowsHtml +
        "</tbody>" +
        "    </table>" +
        "  </div>" +
        "</div>"
      );
    }

    function renderView() {
      const user = MEA.state.user || {};
      const isAdmin = user.role === "admin";
      const settings = MEA.state.settings || {};
      const data = settings.data || {};
      const accounts = settings.accounts || [];

      if (!isAdmin) {
        return renderPermissionDeniedHtml(user);
      }

      return (
        '<div class="panel">' +
        '<div class="panel-header">' +
        "  <div>" +
        '    <h2 class="panel-title">系統設定與授權 (RBAC)</h2>' +
        '    <p class="panel-sub">設定 Google OAuth、登入網域限制與存取成員角色清單</p>' +
        "  </div>" +
        '  <button type="button" class="btn secondary compact" onclick="MEA.accounts.loadSettingsAndAccounts()"' +
        (settings.loading ? " disabled" : "") +
        ">" +
        (settings.loading ? "讀取中..." : "🔄 重新讀取") +
        "</button>" +
        "</div>" +
        renderSystemCoreCardHtml(data, settings.saving) +
        renderWhitelistCardHtml(renderAccountsRowsHtml(accounts, settings.saving), settings.saving) +
        "</div>"
      );
    }

    return {
      loadSettingsAndAccounts: loadSettingsAndAccounts,
      saveSettings: saveSettings,
      addAccountPrompt: addAccountPrompt,
      removeAccount: removeAccount,
      toggleAccount: toggleAccount,
      renderView: renderView
    };
  }

  return {
    createAccountsModule: createAccountsModule
  };
});
  </script>
  <script>
/* js/app.js */
/**
 * @file app.js
 * @description 前端主進入點、路由切換與畫面掛載（可測試控制器）
 */
(function (root, factory) {
  "use strict";

  const api = factory();

  if (typeof window !== "undefined") {
    const MEA = (root.MEA = root.MEA || {});
    const controller = api.createAppController({
      MEA: MEA,
      document: window.document,
      window: window,
      setTimeoutFn: function (fn, ms) {
        return window.setTimeout(fn, ms);
      }
    });

    MEA.setTab = controller.setTab;
    MEA.render = controller.render;
    MEA.init = controller.init;

    if (window.document.readyState === "loading") {
      window.document.addEventListener("DOMContentLoaded", controller.init);
    } else {
      controller.init();
    }
  }

  if (typeof module !== "undefined" && module.exports) {
    module.exports = api;
  }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const LOADING_VIEW_HTML =
    '<div class="login-container">' +
    '<div class="login-card text-center py-12">' +
    '  <div class="spinner mb-4"></div>' +
    '  <div class="text-muted">正在初始化系統連線與設定...</div>' +
    "</div>" +
    "</div>";

  function invoke(module, method) {
    return module && typeof module[method] === "function" ? module[method]() : undefined;
  }

  function syncDocumentTitle(MEA, doc) {
    if (!doc) return;
    const systemName = ((MEA && MEA.state && MEA.state.publicConfig) || {}).systemName;
    if (systemName && doc.title !== systemName) {
      doc.title = systemName;
    }
  }

  /**
   * 在整塊 innerHTML 重建前記錄焦點元素與輸入選取範圍。
   *
   * @param {Object} doc - document 物件
   * @param {Object} mount - 即將重建的掛載元素
   * @returns {Object|null} 焦點快照
   */
  function captureFocusState(doc, mount) {
    const active = doc && doc.activeElement;
    if (!active || !active.id) return null;
    if (mount && active !== mount && typeof mount.contains === "function" && !mount.contains(active)) return null;
    const snapshot = { id: active.id };
    if (typeof active.selectionStart === "number") {
      snapshot.selectionStart = active.selectionStart;
      snapshot.selectionEnd = typeof active.selectionEnd === "number" ? active.selectionEnd : active.selectionStart;
    }
    return snapshot;
  }

  /**
   * 重建後還原先前記錄的焦點與選取範圍；元素不存在時安全略過。
   *
   * @param {Object} doc - document 物件
   * @param {Object} snapshot - captureFocusState 產生的快照
   */
  function restoreFocusState(doc, snapshot) {
    if (!snapshot || !doc || typeof doc.getElementById !== "function") return;
    const element = doc.getElementById(snapshot.id);
    if (!element || typeof element.focus !== "function") return;
    element.focus();
    if (typeof snapshot.selectionStart === "number" && typeof element.setSelectionRange === "function") {
      try {
        element.setSelectionRange(snapshot.selectionStart, snapshot.selectionEnd);
      } catch (e) {
        // 部分輸入類型不支援選取範圍，忽略即可
      }
    }
  }

  function buildBodyHtml(MEA, tab) {
    switch (tab) {
      case "import":
        return invoke(MEA.imports, "renderView") || "";
      case "courses":
        return invoke(MEA.courses, "renderView") || "";
      case "settings":
        return invoke(MEA.accounts, "renderView") || "";
      case "overview":
      default:
        return invoke(MEA.ui, "renderOverviewView") || "";
    }
  }

  function createAppController(deps) {
    const options = deps || {};
    const MEA = options.MEA || (typeof window !== "undefined" ? window.MEA : null) || {};
    const doc = options.document || (typeof document !== "undefined" ? document : null);
    const win = options.window || (typeof window !== "undefined" ? window : null);
    const setTimeoutFn =
      typeof options.setTimeoutFn === "function"
        ? options.setTimeoutFn
        : function (fn, ms) {
            return setTimeout(fn, ms);
          };

    function syncTitle() {
      syncDocumentTitle(MEA, doc);
    }

    function setTab(tabId) {
      if (typeof MEA.setState === "function") {
        MEA.setState({ tab: tabId });
      }
      if (tabId === "courses") {
        invoke(MEA.courses, "fetchList");
      } else if (tabId === "settings") {
        invoke(MEA.accounts, "loadSettingsAndAccounts");
      }
    }

    function cleanUrlQuery() {
      try {
        const topWin = (win && win.top) || win;
        if (topWin && topWin.history && topWin.history.replaceState && topWin.location) {
          const cleanUrl = topWin.location.href.split("?")[0].split("#")[0];
          topWin.history.replaceState({}, doc ? doc.title : "", cleanUrl);
        }
      } catch (e) {}
    }

    function applyInitialAuth() {
      const initial = win && win.INITIAL_AUTH;
      if (!initial || typeof initial !== "object") return false;

      cleanUrlQuery();
      try {
        delete win.INITIAL_AUTH;
      } catch (e) {
        win.INITIAL_AUTH = null;
      }

      if (initial.ok === true) {
        if (MEA.auth && typeof MEA.auth.applyLoginSuccess === "function") {
          MEA.auth.applyLoginSuccess(initial);
        }
        return true;
      }

      if (MEA.api && typeof MEA.api.getToken === "function" && MEA.api.getToken()) {
        invoke(MEA.auth, "restore");
        if (initial.message && typeof MEA.setState === "function") {
          MEA.setState({ loginError: initial.message });
        }
        return true;
      }

      if (typeof MEA.setState === "function") {
        MEA.setState({
          view: "login",
          loginBusy: false,
          loginError: initial.message || "Google 登入失敗，請重新嘗試"
        });
      }
      return true;
    }

    function applyAccountSwitch() {
      if (!MEA.config || !MEA.config.switchAccount) return false;
      cleanUrlQuery();
      if (MEA.api && typeof MEA.api.setToken === "function") MEA.api.setToken("");
      if (MEA.api && typeof MEA.api.setCsrfToken === "function") MEA.api.setCsrfToken("");
      invoke(MEA.auth, "loginActiveUser");
      return true;
    }

    function render() {
      syncTitle();
      if (!doc || typeof doc.getElementById !== "function") return;
      const mount = doc.getElementById("app");
      if (!mount) return;

      const focusSnapshot = captureFocusState(doc, mount);
      const state = MEA.state || {};
      if (state.view === "loading") {
        mount.innerHTML = LOADING_VIEW_HTML;
        restoreFocusState(doc, focusSnapshot);
        return;
      }

      if (state.view === "login") {
        mount.innerHTML = invoke(MEA.ui, "renderLoginView") || "";
        setTimeoutFn(function () {
          invoke(MEA.auth, "renderGoogleButton");
        }, 50);
        restoreFocusState(doc, focusSnapshot);
        return;
      }

      const tab = state.tab || "overview";
      mount.innerHTML =
        '<div class="app-layout">' +
        (invoke(MEA.ui, "renderHeader") || "") +
        (invoke(MEA.ui, "renderNavbar") || "") +
        '<main class="app-content">' +
        buildBodyHtml(MEA, tab) +
        "</main>" +
        "</div>";
      restoreFocusState(doc, focusSnapshot);
    }

    function finishAuth() {
      if (!applyInitialAuth() && !applyAccountSwitch()) {
        invoke(MEA.auth, "restore");
      }
    }

    function init() {
      invoke(MEA.ui, "initThemeAndStyle");
      if (typeof MEA.subscribe === "function") {
        MEA.subscribe(render);
      }

      const request =
        MEA.api && typeof MEA.api.call === "function" ? MEA.api.call("getPublicConfig", {}) : Promise.resolve(null);

      return Promise.resolve(request)
        .then(function (configRes) {
          if (configRes && configRes.ok === true) {
            if (typeof MEA.setState === "function") {
              MEA.setState({ publicConfig: configRes });
            }
            syncTitle();
          }
          finishAuth();
        })
        .catch(function () {
          finishAuth();
        });
    }

    return {
      setTab: setTab,
      cleanUrlQuery: cleanUrlQuery,
      applyInitialAuth: applyInitialAuth,
      applyAccountSwitch: applyAccountSwitch,
      render: render,
      init: init,
      syncDocumentTitle: syncTitle,
      captureFocusState: function () {
        return captureFocusState(
          doc,
          doc && typeof doc.getElementById === "function" ? doc.getElementById("app") : null
        );
      },
      restoreFocusState: function (snapshot) {
        return restoreFocusState(doc, snapshot);
      }
    };
  }

  return {
    createAppController: createAppController,
    syncDocumentTitle: syncDocumentTitle,
    buildBodyHtml: buildBodyHtml,
    captureFocusState: captureFocusState,
    restoreFocusState: restoreFocusState
  };
});
  </script>
