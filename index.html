  <script>
/* js/accounts.js */
/**
 * @file accounts.js
 * @description 系統設定與存取授權白名單（RBAC）管理模組（可測試工廠）。
 *
 * 瀏覽器環境組裝 window.MEA.accounts；Node.js 環境匯出 createAccountsModule 供單元測試注入依賴。
 */
(function (root, factory) {
  "use strict";

  const api = factory();

  if (typeof window !== "undefined") {
    const MEA = (root.MEA = root.MEA || {});
    // task 6.1：僅註冊工廠，實例由 wiring.js 集中建立並注入最小介面。
    if (!MEA.factories) {
      MEA.factories = {};
    }
    MEA.factories.accounts = api.createAccountsModule;
  }

  if (typeof module !== "undefined" && module.exports) {
    module.exports = api;
  }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  /**
   * 角色代碼單一來源（task 5.3）：GAS 全域 gasRuntime 優先，Node 由 require 取得。
   * gasRuntime.js 在建置順序中早於本模組載入，故可安全取得。
   */
  const ROLE_CODES =
    (typeof globalThis !== "undefined" && globalThis.gasRuntime && globalThis.gasRuntime.ROLE_CODES) ||
    (typeof require === "function" ? require("../../gasRuntime.js").ROLE_CODES : null);

  // 網域正規化規則單一來源（task 5.5）：瀏覽器由 gasRuntime 全域取得，Node 由 require 取得。
  const gasRuntime =
    (typeof globalThis !== "undefined" && globalThis.gasRuntime) ||
    (typeof require === "function" ? require("../../gasRuntime.js") : null);

  // task 6.4：共用 Node require 相容墊片與 safeErrors 注入解析（Node 由 require 取得，瀏覽器由全域取得）。
  const moduleHelpers = typeof require === "function" ? require("./moduleHelpers.js") : globalThis.MEA.moduleHelpers;

  /**
   * 純驗證函式：檢查新增帳號表單輸入值
   *
   * @param {Object} input - 輸入值 { email, role, name, enabled }
   * @param {Array<Object>} existingAccounts - 現有帳號清單
   * @returns {Object} `{ valid: boolean, errorKey?: string, message?: string }`
   */
  function validateNewAccountInput(input, existingAccounts) {
    const source = input || {};
    const email = String(source.email || "")
      .trim()
      .toLowerCase();
    if (!email || email.indexOf("@") === -1) {
      return {
        valid: false,
        errorKey: "invalid_email",
        message: "請填寫有效的 Email"
      };
    }

    const accounts = Array.isArray(existingAccounts) ? existingAccounts : [];
    for (let i = 0; i < accounts.length; i++) {
      const item = accounts[i];
      if (
        item &&
        String(item.email || "")
          .trim()
          .toLowerCase() === email
      ) {
        return {
          valid: false,
          errorKey: "duplicate_email",
          message: "此 Email 已在白名單中"
        };
      }
    }

    return { valid: true };
  }

  /**
   * 不可變新增帳號至清單
   *
   * @param {Array<Object>} accounts - 現有帳號清單
   * @param {Object} newAccount - 新帳號物件
   * @returns {Array<Object>} 全新陣列
   */
  function appendAccountToList(accounts, newAccount) {
    const list = Array.isArray(accounts) ? accounts.slice() : [];
    if (!newAccount) return list;
    return list.concat([Object.assign({}, newAccount)]);
  }

  /**
   * 不可變自清單中移除指定 Email 帳號
   *
   * @param {Array<Object>} accounts - 現有帳號清單
   * @param {string} email - 目標 Email
   * @returns {Array<Object>} 全新陣列
   */
  function removeAccountFromList(accounts, email) {
    const cleanEmail = String(email || "")
      .trim()
      .toLowerCase();
    const list = Array.isArray(accounts) ? accounts : [];
    return list.filter(function (a) {
      return (
        a &&
        String(a.email || "")
          .trim()
          .toLowerCase() !== cleanEmail
      );
    });
  }

  /**
   * 不可變切換指定 Email 帳號之啟用狀態
   *
   * @param {Array<Object>} accounts - 現有帳號清單
   * @param {string} email - 目標 Email
   * @returns {Array<Object>} 全新陣列
   */
  function toggleAccountInList(accounts, email) {
    const cleanEmail = String(email || "")
      .trim()
      .toLowerCase();
    const list = Array.isArray(accounts) ? accounts : [];
    return list.map(function (a) {
      if (
        a &&
        String(a.email || "")
          .trim()
          .toLowerCase() === cleanEmail
      ) {
        return Object.assign({}, a, { enabled: !a.enabled });
      }
      return a;
    });
  }

  /**
   * 建立帳號與系統設定模組控制器。
   *
   * @param {Object} [deps] - 依賴注入（MEA、document）
   * @returns {Object} 公開方法集合（與 MEA.accounts 一致）
   */
  function createAccountsModule(deps) {
    const options = deps || {};
    const safeErrors = moduleHelpers.resolveSafeErrors(options);
    const MEA = options.MEA || (typeof window !== "undefined" ? window.MEA : null) || {};
    const doc = options.document || (typeof document !== "undefined" ? document : null);
    // task 6.2：事件綁定守護由共用模組提供（Node 由 require 取得，瀏覽器由全域取得）。
    const bindings = typeof require === "function" ? require("./eventBindings.js") : globalThis.MEA.eventBindings;

    /** 以 document 委派綁定欄位、表單與授權成員操作事件。 */
    function bindEventsOnce() {
      if (!bindings || !doc || typeof doc.addEventListener !== "function") return;
      bindings.delegate(doc, "change", "[data-account-action='clear-field-error']", function (event, element) {
        clearFieldError(element);
      });
      bindings.delegate(doc, "change", "[data-account-action='filter-role']", function (event, element) {
        handleRoleFilter(element.value);
      });
      bindings.delegate(doc, "submit", "[data-account-action='save-settings']", function (event) {
        saveSettings(event);
      });
      bindings.delegate(doc, "click", "[data-account-action]", function (event, element) {
        const action = element.getAttribute("data-account-action");
        if (action === "toggle" || action === "remove") {
          const email = element.getAttribute("data-email") || "";
          return action === "toggle" ? toggleAccount(email) : removeAccount(email);
        }
        if (action === "add") return addAccountPrompt();
        if (action === "reload") return loadSettingsAndAccounts();
        return undefined;
      });
    }

    bindEventsOnce();

    /**
     * 以注入的 document 取得元素，缺損時回傳 null。
     *
     * @param {string} id - 元素識別碼
     * @returns {Object|null} 元素或 null
     */
    function getElementById(id) {
      return doc && typeof doc.getElementById === "function" ? doc.getElementById(id) : null;
    }

    /**
     * 統一錯誤訊息轉譯。
     *
     * @param {*} error - 錯誤物件或字串
     * @param {string} fallback - 原始例外不外顯時使用的文案
     * @returns {string} 可顯示的錯誤訊息
     */
    function normalizeErrorMessage(error, fallback) {
      return safeErrors.resolveSafeMessage(error, fallback);
    }

    /**
     * 讀取後端系統參數與成員白名單設定。
     */
    function loadSettingsAndAccounts() {
      MEA.setState({
        settings: Object.assign({}, MEA.state.settings || {}, { loading: true })
      });

      Promise.all([MEA.api.call("getSystemSettings", {}), MEA.api.call("getAccounts", {})])
        .then(function (results) {
          const settingsRes = results[0];
          const accountsRes = results[1];

          MEA.setState({
            settings: {
              loading: false,
              saving: false,
              data: settingsRes && settingsRes.settings ? settingsRes.settings : {},
              accounts: accountsRes && accountsRes.accounts ? accountsRes.accounts : []
            }
          });
        })
        .catch(function (error) {
          MEA.setState({
            settings: Object.assign({}, MEA.state.settings || {}, { loading: false })
          });
          MEA.ui.toast(normalizeErrorMessage(error, "讀取系統設定失敗，請稍後再試"), "err");
        });
    }

    /**
     * 讀取系統設定表單欄位。
     *
     * @returns {Object} 表單值快照
     */
    function collectSettingsFormValues() {
      const systemNameInput = getElementById("cfgSystemName");
      const schoolYearInput = getElementById("cfgSchoolYear");
      const semesterInput = getElementById("cfgSemester");
      const clientIdInput = getElementById("cfgClientId");
      const clientSecretInput = getElementById("cfgClientSecret");
      const allowedDomainInput = getElementById("cfgAllowedDomain");
      const restrictInput = getElementById("cfgRestrictWhitelist");

      return {
        systemName: systemNameInput ? systemNameInput.value.trim() : "",
        schoolYear: schoolYearInput ? schoolYearInput.value.trim() : "",
        semester: semesterInput ? semesterInput.value.trim() : "",
        clientId: clientIdInput ? clientIdInput.value.trim() : "",
        clientSecret: clientSecretInput ? clientSecretInput.value.trim() : "",
        allowedLoginDomain: gasRuntime.normalizeAllowedDomain(allowedDomainInput ? allowedDomainInput.value : ""),
        restrict: !!(restrictInput && restrictInput.checked)
      };
    }

    /**
     * 由表單值建構後端儲存參數。
     *
     * @param {Object} values - 表單值快照
     * @returns {Object} API payload
     */
    function buildSettingsPayload(values) {
      return {
        settings: {
          systemName: values.systemName,
          schoolYear: values.schoolYear,
          semester: values.semester,
          clientId: values.clientId,
          clientSecret: values.clientSecret,
          allowedLoginDomain: values.allowedLoginDomain,
          restrictWhitelist: values.restrict ? "true" : "false"
        }
      };
    }

    /**
     * 由表單值建構前端公眾設定更新片段。
     *
     * @param {Object} values - 表單值快照
     * @returns {Object} publicConfig 更新片段
     */
    function buildPublicConfigPatch(values) {
      return {
        systemName: values.systemName,
        schoolYear: values.schoolYear,
        semester: values.semester,
        clientId: values.clientId,
        allowedDomain: values.allowedLoginDomain,
        hasClientSecret: Boolean(values.clientSecret)
      };
    }

    /**
     * 結束儲存中狀態。
     */
    function finishSettingsSaving() {
      MEA.setState({
        settings: Object.assign({}, MEA.state.settings || {}, { saving: false })
      });
    }

    /**
     * 處理系統設定儲存結果（原 saveSettings 的 then 回呼）。
     *
     * @param {Object} result - API 回應
     * @param {Object} values - 表單值快照
     */
    function handleSettingsSaveResult(result, values) {
      finishSettingsSaving();
      if (result && result.ok) {
        MEA.ui.toast("系統參數已成功儲存！", "ok");
        if (MEA.state.publicConfig) {
          MEA.setState({
            publicConfig: Object.assign({}, MEA.state.publicConfig, buildPublicConfigPatch(values))
          });
        }
      } else {
        MEA.ui.toast((result && result.message) || "儲存失敗", "err");
      }
    }

    /**
     * 儲存系統設定表單資料至後端。
     *
     * @param {Event} [e] - 表單提交事件
     */
    function saveSettings(e) {
      if (e && e.preventDefault) e.preventDefault();
      const values = collectSettingsFormValues();

      MEA.setState({
        settings: Object.assign({}, MEA.state.settings || {}, { saving: true })
      });

      MEA.api
        .call("saveSystemSettings", buildSettingsPayload(values))
        .then(function (result) {
          handleSettingsSaveResult(result, values);
        })
        .catch(function (error) {
          finishSettingsSaving();
          MEA.ui.toast(normalizeErrorMessage(error, "儲存系統設定失敗，請稍後再試"), "err");
        });
    }

    /**
     * 讀取新增授權成員表單欄位。
     *
     * @returns {Object} 表單值快照
     */
    function readNewAccountValues() {
      const emailInput = getElementById("newAccountEmail");
      const nameInput = getElementById("newAccountName");
      const roleSelect = getElementById("newAccountRole");

      return {
        email: emailInput ? emailInput.value.trim().toLowerCase() : "",
        name: nameInput ? nameInput.value.trim() : "",
        role: roleSelect ? roleSelect.value : ROLE_CODES.VIEWER
      };
    }

    /**
     * 標記欄位驗證失敗，並以欄位層級錯誤訊息通知輔助科技。
     *
     * @param {string} fieldId - 表單控制項 id
     * @param {string} message - 錯誤訊息
     */
    function setFieldError(fieldId, message) {
      const field = getElementById(fieldId);
      const error = getElementById(fieldId + "Error");
      if (field && typeof field.setAttribute === "function") field.setAttribute("aria-invalid", "true");
      if (error) {
        error.textContent = message;
        if (typeof error.removeAttribute === "function") error.removeAttribute("hidden");
      }
      MEA.ui.toast(message, "warn");
    }

    /**
     * 清除欄位錯誤標記與訊息。
     *
     * @param {Object} field - 表單控制項
     */
    function clearFieldError(field) {
      if (!field) return;
      if (typeof field.removeAttribute === "function") field.removeAttribute("aria-invalid");
      const id = typeof field.getAttribute === "function" ? field.getAttribute("id") : "";
      const error = id ? getElementById(id + "Error") : null;
      if (error) {
        error.textContent = "";
        if (typeof error.setAttribute === "function") error.setAttribute("hidden", "");
      }
    }

    /**
     * 處理「新增」按鈕點擊（原 addAccountPrompt 的 onClick 回呼）。
     */
    function handleAddAccountClick() {
      const values = readNewAccountValues();
      clearFieldError(getElementById("newAccountEmail"));
      const cur = (MEA.state.settings && MEA.state.settings.accounts) || [];
      const validation = validateNewAccountInput(values, cur);
      if (!validation.valid) {
        setFieldError("newAccountEmail", validation.message);
        return;
      }

      const roleName = (MEA.config && MEA.config.roleNames && MEA.config.roleNames[values.role]) || values.role;
      const newAccount = {
        email: values.email,
        name: values.name || values.email,
        role: values.role,
        roleName: roleName,
        enabled: true
      };
      saveAccountsList(appendAccountToList(cur, newAccount));
      MEA.ui.closeModal();
    }

    /**
     * 開啟新增授權成員對話框。
     */
    function addAccountPrompt() {
      const roleNames = (MEA.config && MEA.config.roleNames) || {};
      const escapeHtml =
        MEA.ui && typeof MEA.ui.escapeHtml === "function"
          ? MEA.ui.escapeHtml
          : function (value) {
              return String(value);
            };
      const roleOptions = Object.keys(roleNames)
        .map(function (role) {
          return (
            '<option value="' +
            escapeHtml(role) +
            '">' +
            escapeHtml(roleNames[role]) +
            " (" +
            escapeHtml(role) +
            ")</option>"
          );
        })
        .join("");

      const html =
        '<div class="form-group">' +
        '  <label class="label" for="newAccountEmail">Google Email</label>' +
        '  <input type="email" id="newAccountEmail" class="input" placeholder="user@example.com" required aria-required="true" aria-describedby="newAccountEmailHint newAccountEmailError" data-account-action="clear-field-error" />' +
        '  <span class="hint" id="newAccountEmailHint">請輸入完整的 Google 電子郵件地址。</span>' +
        '  <span class="field-error" id="newAccountEmailError" role="alert" hidden></span>' +
        "</div>" +
        '<div class="form-group mt-2">' +
        '  <label class="label" for="newAccountName">姓名或職稱</label>' +
        '  <input type="text" id="newAccountName" class="input" placeholder="王小明" />' +
        "</div>" +
        '<div class="form-group mt-2">' +
        '  <label class="label" for="newAccountRole">指派角色</label>' +
        '  <select id="newAccountRole" class="select">' +
        roleOptions +
        "  </select>" +
        "</div>";

      MEA.ui.modal("新增授權帳號", html, [
        { text: "取消", secondary: true, onClick: MEA.ui.closeModal },
        {
          text: "新增",
          primary: true,
          onClick: handleAddAccountClick
        }
      ]);
    }

    /**
     * 彈出確認對話框並自白名單移除成員。
     *
     * @param {string} email - 目標電子郵件
     */
    function removeAccount(email) {
      const cur = (MEA.state.settings && MEA.state.settings.accounts) || [];
      const updated = removeAccountFromList(cur, email);
      MEA.ui.modal(
        "確認刪除授權成員",
        '<p class="mb-2">確定要刪除 <strong>' +
          MEA.ui.escapeHtml(email) +
          "</strong> 嗎？刪除後該帳號將立即失去存取權。</p>",
        [
          { text: "取消", onClick: MEA.ui.closeModal },
          {
            text: "確認刪除",
            primary: true,
            onClick: function () {
              MEA.ui.closeModal();
              saveAccountsList(updated);
            }
          }
        ]
      );
    }

    /**
     * 切換指定成員帳號的啟用/停用狀態。
     *
     * @param {string} email - 目標電子郵件
     */
    function toggleAccount(email) {
      const cur = (MEA.state.settings && MEA.state.settings.accounts) || [];
      const updated = toggleAccountInList(cur, email);
      saveAccountsList(updated);
    }

    /**
     * 結束白名單儲存中狀態。
     */
    function finishWhitelistSaving() {
      MEA.setState({
        settings: Object.assign({}, MEA.state.settings || {}, { saving: false })
      });
    }

    /**
     * 處理白名單儲存結果（原 saveAccountsList 的 then 回呼）。
     *
     * @param {Object} result - API 回應
     */
    function handleWhitelistSaveResult(result) {
      finishWhitelistSaving();
      if (result && result.ok) {
        MEA.ui.toast("授權白名單已更新！", "ok");
      } else {
        MEA.ui.toast((result && result.message) || "白名單更新失敗", "err");
      }
    }

    /**
     * 將更新後的授權成員清單儲存至後端試算表。
     *
     * @param {Array<Object>} accounts - 帳號清單
     */
    function saveAccountsList(accounts) {
      MEA.setState({
        settings: Object.assign({}, MEA.state.settings || {}, {
          saving: true,
          accounts: accounts
        })
      });

      MEA.api
        .call("saveWhitelist", { accounts: accounts })
        .then(function (result) {
          handleWhitelistSaveResult(result);
        })
        .catch(function (error) {
          finishWhitelistSaving();
          MEA.ui.toast(normalizeErrorMessage(error, "儲存授權成員失敗，請稍後再試"), "err");
        });
    }

    /**
     * 產生權限不足面板。
     *
     * @param {Object} user - 目前使用者
     * @returns {string} HTML 字串
     */
    function renderPermissionDeniedHtml(user) {
      return (
        '<div class="panel">' +
        '<div class="panel-header"><h2 class="panel-title">權限不足</h2></div>' +
        '<div class="alert err">您目前的角色（' +
        MEA.ui.escapeHtml(user.roleName || user.role) +
        "）無權限檢視或修改系統設定與授權名單。</div>" +
        "</div>"
      );
    }

    /**
     * 產生單筆授權成員表格列。
     *
     * @param {Object} a - 帳號紀錄
     * @param {boolean} saving - 是否正在儲存
     * @returns {string} HTML 字串
     */
    function renderAccountRowHtml(a, saving) {
      const disabled = saving ? " disabled" : "";
      return (
        "<tr>" +
        "<td><strong>" +
        MEA.ui.escapeHtml(a.email) +
        "</strong></td>" +
        "<td>" +
        MEA.ui.escapeHtml(a.name) +
        "</td>" +
        '<td><span class="pill ' +
        (a.role === ROLE_CODES.ADMIN ? "accent" : "muted") +
        '">' +
        MEA.ui.escapeHtml(a.roleName || a.role) +
        "</span></td>" +
        "<td>" +
        '  <span class="badge ' +
        (a.enabled ? "badge-ok" : "badge-err") +
        '">' +
        (a.enabled ? "已啟用" : "已停用") +
        "  </span>" +
        "</td>" +
        "<td>" +
        '  <button type="button" class="btn secondary compact" data-account-action="toggle" data-email="' +
        MEA.ui.escapeHtml(a.email) +
        '"' +
        disabled +
        ">" +
        (a.enabled ? "停用" : "啟用") +
        "</button>" +
        '  <button type="button" class="btn danger compact" data-account-action="remove" data-email="' +
        MEA.ui.escapeHtml(a.email) +
        '"' +
        disabled +
        ">刪除</button>" +
        "</td>" +
        "</tr>"
      );
    }

    /**
     * 產生授權成員表格內容。
     *
     * @param {Array<Object>} accounts - 帳號陣列

        (saving ? " disabled" : "") +
        ">＋ 新增授權成員</button>" +

    /**

    function renderView() {
      const user = MEA.state.user || {};

        (settings.loading ? " disabled" : "") +

        (settings.loading ? "讀取中..." : "🔄 重新讀取") +

        "</div>" +

    return {
      loadSettingsAndAccounts: loadSettingsAndAccounts,
      saveSettings: saveSettings,

  }

  return {
    createAccountsModule: createAccountsModule,
    validateNewAccountInput: validateNewAccountInput,
    appendAccountToList: appendAccountToList,
    removeAccountFromList: removeAccountFromList,
    toggleAccountInList: toggleAccountInList
  };
});

  <script>
/* js/activityLog.js */
/**
 * @file activityLog.js
 * @description 操作日誌清單、篩選、分頁與詳情展開（可測試工廠）。
 *
 * 瀏覽器環境組裝 window.MEA.activityLog；Node.js 環境匯出 createActivityLogModule 供單元測試注入依賴。
 */
(function (root, factory) {
  "use strict";

  const api = factory();

  if (typeof window !== "undefined") {
    const MEA = (root.MEA = root.MEA || {});
    // task 6.1：僅註冊工廠，實例由 wiring.js 集中建立並注入最小介面。
    if (!MEA.factories) {
      MEA.factories = {};
    }
    MEA.factories.activityLog = api.createActivityLogModule;
  }

  if (typeof module !== "undefined" && module.exports) {
    module.exports = api;
  }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  // task 6.4：共用 Node require 相容墊片與 safeErrors 注入解析（Node 由 require 取得，瀏覽器由全域取得）。
  const moduleHelpers = typeof require === "function" ? require("./moduleHelpers.js") : globalThis.MEA.moduleHelpers;

  /** 後端已明確定義的錯誤代碼文案（查詢日誌專用） */
  const SAFE_ERROR_MESSAGES = {
    invalid_date_range: "日期格式不正確或日期區間無效",
    forbidden: "您的帳號沒有存取操作日誌的權限",
    unauthorized: "登入狀態已失效，請重新登入"
  };

  /** 事件類別顯示名稱（與後端 logCategory 一致） */
  const CATEGORY_LABELS = {
    auth: "身份驗證",
    write: "寫入操作",
    query: "查詢操作"
  };

  /** 預設查詢天數與每頁筆數（與後端 getActivityLog 上限一致） */
  const DEFAULT_DAYS = 7;
  const DEFAULT_PAGE_SIZE = 50;
  const MAX_PAGE_SIZE = 500;

  /**
   * 以 Asia/Taipei 時區格式化日期為 yyyy-MM-dd。
   *
   * @param {Date} date - 日期物件
   * @returns {string} 日期字串
   */
  function formatTaipeiDate(date) {
    try {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);
      const values = {};
      parts.forEach(function (part) {
        values[part.type] = part.value;
      });
      return values.year + "-" + values.month + "-" + values.day;
    } catch (error) {
      return new Date(date.getTime() + 8 * 60 * 60 * 1000).toISOString().slice(0, 10);
    }
  }

  /**
   * 取得預設日期區間（最近 7 天，含今日）。
   *
   * @returns {Object} `{ startDate, endDate }`
   */
  function defaultDateRange() {
    const now = new Date();
    return {
      startDate: formatTaipeiDate(new Date(now.getTime() - (DEFAULT_DAYS - 1) * 24 * 60 * 60 * 1000)),
      endDate: formatTaipeiDate(now)
    };
  }

  /**
   * 建立操作日誌模組控制器。
   *
   * @param {Object} [deps] - 依賴注入（MEA、document）
   * @returns {Object} 公開方法集合（與 MEA.activityLog 一致）
   */
  function createActivityLogModule(deps) {
    const options = deps || {};
    const safeErrors = moduleHelpers.resolveSafeErrors(options);
    const MEA = options.MEA || (typeof window !== "undefined" ? window.MEA : null) || {};
    const doc = options.document || (typeof document !== "undefined" ? document : null);
    // task 6.2：事件綁定守護由共用模組提供（Node 由 require 取得，瀏覽器由全域取得）。
    const bindings = typeof require === "function" ? require("./eventBindings.js") : globalThis.MEA.eventBindings;
    // task 6.3：列表控制流程由共用控制器提供（Node 由 require 取得，瀏覽器由全域取得）。
    const listControllerModule =
      typeof require === "function" ? require("./listController.js") : globalThis.MEA.listController;

    const listCtl = listControllerModule.createListController({
      apiAction: "getActivityLog",
      getState: currentState,
      setState: function (next) {
        MEA.setState({ activityLog: next });
      },
      canCallApi: function () {
        return !!(MEA.api && typeof MEA.api.call === "function");
      },
      callApi: function (action, payload) {
        return MEA.api.call(action, payload);
      },
      toast: function (message, kind) {
        MEA.ui.toast(message, kind);
      },
      buildQuery: function (state, page) {
        return {
          startDate: state.startDate,
          endDate: state.endDate,
          email: state.email,
          category: state.category,
          page: page,
          pageSize: state.pageSize
        };
      },
      buildSuccessPatch: function (state, result, page) {
        const total = Number(result.total) || 0;
        const pageSize = Math.min(MAX_PAGE_SIZE, Number(result.pageSize) || DEFAULT_PAGE_SIZE);
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        const resolvedPage = Math.min(Math.max(1, Number(result.page) || page), totalPages);
        return {
          loading: false,
          list: result.rows || [],
          total: total,
          page: resolvedPage,
          pageSize: pageSize,
          totalPages: totalPages
        };
      },
      readFilters: readFilterFormValues,
      buildResetPatch: function () {
        const range = defaultDateRange();
        return {
          startDate: range.startDate,
          endDate: range.endDate,
          email: "",
          category: "",
          expanded: {}
        };
      },
      buildSearchExtraPatch: function () {
        return { expanded: {} };
      },
      resolveFailureMessage: function (result, fallback) {
        return resolveLogError(result, fallback);
      },
      resolveErrorMessage: function (error, fallback) {
        return resolveLogError(error, fallback);
      },
      normalizePage: function (requested, state) {
        return Math.max(1, requested || state.page || 1);
      },
      failureFallback: "讀取操作日誌失敗",
      errorFallback: "讀取操作日誌失敗，請稍後再試",
      pagination: {
        actionAttribute: "data-activity-action",
        number: function (value) {
          return MEA.ui.number(value);
        },
        normalize: function (state) {
          const totalPages = Math.max(1, state.totalPages || 1);
          return {
            total: state.total,
            currentPage: Math.min(Math.max(1, state.page || 1), totalPages),
            totalPages: totalPages
          };
        }
      }
    });

    const fetchList = listCtl.fetchList;
    const handleSearch = listCtl.handleSearch;
    const resetSearch = listCtl.resetSearch;

    /**
     * 取得目前日誌狀態，缺損時回傳含預設值的物件。
     *
     * @returns {Object} 日誌狀態
     */
    function currentState() {
      const state = MEA.state && MEA.state.activityLog ? MEA.state.activityLog : {};
      const range = defaultDateRange();
      return {
        list: state.list || [],
        total: state.total || 0,
        page: state.page || 1,
        pageSize: Math.min(MAX_PAGE_SIZE, state.pageSize || DEFAULT_PAGE_SIZE),
        totalPages: state.totalPages || 1,
        startDate: state.startDate || range.startDate,
        endDate: state.endDate || range.endDate,
        email: state.email || "",
        category: state.category || "",
        loading: state.loading === true,
        expanded: state.expanded || {}
      };
    }

    /**
     * 取得特定元素參照。
     *
     * @param {string} id - 元素識別碼
     * @returns {HTMLElement|null} DOM 元素或 null
     */
    function getElementById(id) {
      return doc && typeof doc.getElementById === "function" ? doc.getElementById(id) : null;
    }

    /**
     * 解析操作日誌專用之安全錯誤訊息。
     *
     * @param {*} value - 錯誤回應物件或代碼
     * @param {string} [fallbackMessage] - 備援提示字串
     * @returns {string} 提示訊息
     */
    function resolveLogError(value, fallbackMessage) {
      const fallback = fallbackMessage || "讀取操作日誌失敗";
      const code = value && (value.error || value.code);
      if (code && SAFE_ERROR_MESSAGES[code]) return SAFE_ERROR_MESSAGES[code];
      return safeErrors.resolveSafeMessage(value, fallback);
    }

    /**
     * 讀取篩選表單欄位值。
     *
     * @returns {Object} 表單值快照
     */
    function readFilterFormValues() {
      const startInput = getElementById("activityLogStartDate");
      const endInput = getElementById("activityLogEndDate");
      const emailInput = getElementById("activityLogEmail");
      const categorySelect = getElementById("activityLogCategory");
      const range = defaultDateRange();
      return {
        startDate: startInput ? String(startInput.value || "").trim() : range.startDate,
        endDate: endInput ? String(endInput.value || "").trim() : range.endDate,
        email: emailInput ? String(emailInput.value || "").trim() : "",
        category: categorySelect ? String(categorySelect.value || "").trim() : ""
      };
    }

    /**
     * 展開或收起單一列詳情。
     *
     * @param {string} requestId - 請求識別碼
     */
    function toggleDetail(requestId) {
      const cur = currentState();
      const expanded = Object.assign({}, cur.expanded);
      const key = String(requestId || "");
      expanded[key] = !expanded[key];
      MEA.setState({ activityLog: Object.assign({}, cur, { expanded: expanded }) });
    }

    function bindEventsOnce() {
      if (!bindings || !doc || typeof doc.addEventListener !== "function") return;
      bindings.delegate(doc, "submit", "[data-activity-form]", function (event, form) {
        if (form.getAttribute("data-activity-form") === "search") handleSearch(event);
      });
      bindings.delegate(doc, "click", "[data-activity-action]", function (event, button) {
        const action = button.getAttribute("data-activity-action");
        const handlers = {
          refresh: function () {
            return fetchList(currentState().page);
          },
          reset: function () {
            return resetSearch();
          },
          page: function () {
            const page = parseInt(button.getAttribute("data-page"), 10);
            return Number.isFinite(page) ? fetchList(page) : undefined;
          },
          "toggle-detail": function () {
            return toggleDetail(button.getAttribute("data-request-id"));
          }
        };
        const handler = handlers[action];
        if (handler) handler();
      });
    }

    bindEventsOnce();

    /**
     * 產生事件類別下拉選項。
     *

        const chosen = selected === value ? " selected" : "";

          '<option value="' +
          MEA.ui.escapeHtml(value) +
          '"' +
          chosen +
          ">" +
          MEA.ui.escapeHtml(CATEGORY_LABELS[value]) +
          "</option>";
      });
      return html;
    }

    /**
     * 產生篩選表單。
     *
     * @param {Object} state - 日誌狀態
     * @returns {string} HTML 字串
     */
    function renderFilterFormHtml(state) {
      return (
        '<div class="filter-bar">' +
        '  <form class="filter-form" data-activity-form="search">' +
        '    <label class="sr-only" for="activityLogStartDate">開始日期</label>' +
        '    <input type="date" id="activityLogStartDate" class="input" value="' +
        MEA.ui.escapeHtml(state.startDate) +
        '" />' +
        '    <label class="sr-only" for="activityLogEndDate">結束日期</label>' +
        '    <input type="date" id="activityLogEndDate" class="input" value="' +
        MEA.ui.escapeHtml(state.endDate) +
        '" />' +
        '    <label class="sr-only" for="activityLogEmail">操作者</label>' +
        '    <input type="text" id="activityLogEmail" class="input" placeholder="操作者 email" value="' +
        MEA.ui.escapeHtml(state.email) +
        '" />' +
        '    <label class="sr-only" for="activityLogCategory">事件類別</label>' +
        '    <select id="activityLogCategory" class="select">' +
        renderCategoryOptionsHtml(state.category) +
        "    </select>" +
        '    <button type="submit" class="btn primary"' +
        (state.loading ? " disabled" : "") +
        ">搜尋</button>" +
        '    <button type="button" class="btn secondary" data-activity-action="reset"' +
        (state.loading ? " disabled" : "") +
        ">重設</button>" +
        "  </form>" +
        "</div>"
      );
    }

    /**
     * 產生單一列日誌與其詳情列。

  // 使模組間交叉呼叫在執行期皆能解析已建立的模組。
  const deps = Object.assign({ MEA: services }, services);

  /** app 最後建立，因為它需要路由其他模組的 renderView／fetchList。 */
  const MODULE_ORDER = ["ui", "auth", "imports", "courses", "accounts", "activityLog"];
  MODULE_ORDER.forEach(function (name) {
    services[name] = factories[name] ? factories[name](deps) : MEA[name];
    MEA[name] = services[name];
  });

  /** navigation 最小介面：setTab 由 app controller 提供，renderNavbar 由 ui 提供。 */
  services.navigation = {
    setTab: null,
    renderNavbar: pickMethod(services.ui, "renderNavbar")
  };

  /** views：各頁籤 renderView，集中注入 app controller。 */
  services.views = {
    overview: pickMethod(services.ui, "renderOverviewView"),
    import: pickMethod(services.imports, "renderView"),
    courses: pickMethod(services.courses, "renderView"),
    settings: pickMethod(services.accounts, "renderView"),
    activityLog: pickMethod(services.activityLog, "renderView")
  };
  deps.navigation = services.navigation;
  deps.views = services.views;

  const app = factories.app ? factories.app(deps) : null;
  if (app) {
    services.navigation.setTab = app.setTab;
    MEA.setTab = app.setTab;
    MEA.render = app.render;
    MEA.init = app.init;

    if (doc.readyState === "loading") {
      doc.addEventListener("DOMContentLoaded", app.init);
    } else {
      app.init();
    }
  }
  MEA.factories = factories;
})(typeof globalThis !== "undefined" ? globalThis : this);
  </script>
</body>
