<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文件總覽 - GAS-Course-Web-Template</title>
  <style>
    :root {
      --bg: #f8fafc;
      --paper: #ffffff;
      --ink: #0f172a;
      --ink-muted: #475569;
      --line: #e2e8f0;
      --line-subtle: #f1f5f9;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-bg: #eff6ff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius: 8px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }
    html[data-theme="dark"] {
      --bg: #0b1120;
      --paper: #1e293b;
      --ink: #f8fafc;
      --ink-muted: #cbd5e1;
      --line: #334155;
      --line-subtle: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-bg: #1e3a8a33;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      padding: 40px 20px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title-group h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .title-group p {
      color: var(--ink-muted);
      margin-top: 4px;
      font-size: 15px;
    }
    .btn-toggle {
      background: var(--paper);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .doc-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 18px;
      align-items: flex-start;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
    }
    .doc-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .card-icon {
      font-size: 28px;
      background: var(--primary-bg);
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-body h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .card-body p {
      color: var(--ink-muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .meta {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .pill {
      font-size: 11.5px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: var(--line-subtle);
      border: 1px solid var(--line);
      color: var(--ink-muted);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>📖 GAS 應用程式範本技術手冊庫</h1>
        <p>Google Apps Script 全端專案開發指南與功能說明文件</p>
      </div>
      <button class="btn-toggle" onclick="toggleTheme()">◐ 切換深淺色</button>
    </header>

    <div class="card-grid">
      <a href="rbac-guide.html" class="doc-card">
        <div class="card-icon">🛡️</div>
        <div class="card-body">
          <h2>依帳號角色管理權限 (RBAC) 實作教學</h2>
          <p>深入探討如何在系統中新增自訂角色、定義後端 API 權限矩陣、前端按鈕與頁籤防護，並透過 Google 試算表與 Web App 介面動態指派角色。</p>
          <div class="meta">
            <span class="pill">核心安全性</span>
            <span class="pill">RBAC</span>
            <span class="pill">角色權限</span>
          </div>
        </div>
      </a>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const cur = document.documentElement.dataset.theme;
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("doc_theme", next);
    }
    const saved = localStorage.getItem("doc_theme");
    if (saved) document.documentElement.dataset.theme = saved;
  </script>
</body>
</html>
